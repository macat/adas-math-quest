<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
<script>
// Override console.error to capture errors
const errors = [];
const origError = console.error;
console.error = function(...args) {
  errors.push(args.join(' '));
  origError.apply(console, args);
};
const origWarn = console.warn;
console.warn = function(...args) {
  errors.push('WARN: ' + args.join(' '));
  origWarn.apply(console, args);
};
window.addEventListener('error', e => errors.push('ERR: ' + e.message + ' at ' + e.filename + ':' + e.lineno));
window._getErrors = () => errors.join('\n---\n');
</script>
<iframe src="/" style="width:100%;height:100%;border:none" id="gameFrame"></iframe>
<div id="err" style="position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.8);color:lime;font-size:12px;max-height:200px;overflow:auto;padding:5px;z-index:99999">Waiting...</div>
<script>
setInterval(() => {
  document.getElementById('err').textContent = errors.length ? errors.join(' | ') : 'No errors';
}, 1000);
</script>
</body>
</html>
