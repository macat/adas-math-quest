// ===== SIMPLE 2D THUMBNAIL DRAWING (for menus) =====
function drawPlayerThumb(ctx, charKey, w, h) {
  const ch = CHARS[charKey] || CHARS.ranger;
  ctx.clearRect(0, 0, w, h);
  // Body
  ctx.fillStyle = ch.color;
  ctx.beginPath(); ctx.arc(w/2, h*0.55, w*0.22, 0, Math.PI*2); ctx.fill();
  // Head
  ctx.fillStyle = '#FDBCB4';
  ctx.beginPath(); ctx.arc(w/2, h*0.32, w*0.18, 0, Math.PI*2); ctx.fill();
  // Hair
  ctx.fillStyle = ch.hairColor;
  ctx.beginPath(); ctx.arc(w/2, h*0.26, w*0.19, Math.PI, 0); ctx.fill();
  // Eyes
  ctx.fillStyle = '#333';
  ctx.fillRect(w/2-6, h*0.30, 3, 4);
  ctx.fillRect(w/2+3, h*0.30, 3, 4);
  // Smile
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(w/2, h*0.36, w*0.06, 0.2, Math.PI-0.2); ctx.stroke();
  // Legs
  ctx.fillStyle = ch.pantsColor;
  ctx.fillRect(w/2-8, h*0.68, 6, h*0.2);
  ctx.fillRect(w/2+2, h*0.68, 6, h*0.2);
  // Shoes
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(w/2-9, h*0.85, 8, 5);
  ctx.fillRect(w/2+1, h*0.85, 8, 5);
}

function drawDogThumb(ctx, dogKey, w, h) {
  const dog = DOGS[dogKey]; if (!dog) return;
  ctx.clearRect(0, 0, w, h);
  // Body
  ctx.fillStyle = dog.bodyColor;
  ctx.beginPath(); ctx.ellipse(w/2, h*0.55, w*0.28, h*0.18, 0, 0, Math.PI*2); ctx.fill();
  // Head
  ctx.beginPath(); ctx.arc(w/2, h*0.35, w*0.16, 0, Math.PI*2); ctx.fill();
  // Ears
  ctx.fillStyle = dog.earColor;
  if (dog.earStyle === 'floppy') {
    ctx.beginPath(); ctx.ellipse(w/2-w*0.14, h*0.38, w*0.06, h*0.08, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w/2+w*0.14, h*0.38, w*0.06, h*0.08, 0, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(w/2-10, h*0.28); ctx.lineTo(w/2-14, h*0.18); ctx.lineTo(w/2-4, h*0.25); ctx.fill();
    ctx.beginPath(); ctx.moveTo(w/2+10, h*0.28); ctx.lineTo(w/2+14, h*0.18); ctx.lineTo(w/2+4, h*0.25); ctx.fill();
  }
  // Eyes & nose
  ctx.fillStyle = '#333';
  ctx.fillRect(w/2-5, h*0.32, 3, 3);
  ctx.fillRect(w/2+2, h*0.32, 3, 3);
  ctx.fillRect(w/2-2, h*0.38, 4, 3);
  // Legs
  ctx.fillStyle = dog.bodyColor;
  for (const lx of [-10,-3,4,11]) ctx.fillRect(w/2+lx, h*0.68, 5, h*0.15);
  // Tail
  ctx.strokeStyle = dog.bodyColor; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(w/2+w*0.25, h*0.5); ctx.quadraticCurveTo(w/2+w*0.35, h*0.35, w/2+w*0.3, h*0.28); ctx.stroke();
}


// ===== GAME STATE =====
let game=null,playerChar='ranger',playerName='Ada';
let globalFC=0,animF=0;

class Game{
  constructor(li){
    this.ld=LEVELS[li];this.li=li;
    this.map=this.ld.map.map(r=>[...r]);this.mh=this.map.length;this.mw=this.map[0].length;
    this.p={x:this.ld.start.x,y:this.ld.start.y,dir:'down',frame:0,moving:false,
      tx:this.ld.start.x,ty:this.ld.start.y,px:this.ld.start.x,py:this.ld.start.y,
      idleT:0,bobDir:1};
    this.dogs=this.ld.dogs.map(d=>({...d,rescued:false,followX:0,followY:0}));
    this.rescued=[];
    this.gates=this.ld.gates.map(g=>({...g,open:false,quests:null,openAnim:0}));
    this.npcs=this.ld.npcs.map(n=>({...n,bobT:Math.random()*100}));
    this.startTime=Date.now();this.mistakes=0;this.totalDogs=this.dogs.length;
    this.fc=0;this.particles=[];this.showBubble=null;
    this.activeQuest=null;this.questIdx=0;this.questList=null;
    this.moveDir=null;this.moveHeld=false;this.moveCD=0;
    this.gateOpenEffect=null;

    // === ENGAGEMENT SYSTEMS ===
    // Coins
    this.coins=[];this.coinsCollected=0;this.coinMeshes=[];this.totalCoins=0;
    this.placeCoinPositions();
    // Streak
    this.streak=0;this.bestStreak=0;
    // Speed boost
    this.speedBoosts=[];this.boostActive=false;this.boostTimer=0;this.boostMeshes=[];
    this.placeSpeedBoosts();
    // Ambient life
    this.butterflies=[];this.sparkles=[];
    // Minimap fog of war
    this.visited=new Set();this.visited.add(this.p.x+','+this.p.y);
    // Dog bark timer
    this.barkTimer=180+Math.floor(Math.random()*120);

    // Build 3D scene
    buildLevel3D(this.ld);
    this.build3DEntities();
    this.build3DCoins();
    this.build3DBoosts();
    this.build3DButterflies();

    // Position camera
    this.updateCam(true);
  }

  build3DEntities() {
    // Player mesh
    playerGroup = buildPlayer3D(playerChar);
    playerGroup.position.set(this.p.x + 0.5, 0, this.p.y + 0.5);
    scene.add(playerGroup);
    sceneObjects.push(playerGroup);
    playerMesh = playerGroup;

    // Gates
    this.gates.forEach((g, gi) => {
      if (!g.open && this.map[g.y] && this.map[g.y][g.x] === T.GATE) {
        const gm = buildGate3D(false);
        gm.position.set(g.x + 0.5, 0, g.y + 0.5);
        // Determine gate orientation: if wall tiles above/below, barrier runs N-S → rotate gate
        const wallSet = new Set([T.TREE, T.ROCK, T.BUILDING, T.WATER, T.RIVER, T.FENCE, T.BUSH]);
        const aboveWall = g.y > 0 && this.map[g.y-1] && wallSet.has(this.map[g.y-1][g.x]);
        const belowWall = g.y < this.map.length-1 && this.map[g.y+1] && wallSet.has(this.map[g.y+1][g.x]);
        if (aboveWall || belowWall) {
          gm.rotation.y = Math.PI / 2;
        }
        scene.add(gm);
        sceneObjects.push(gm);
        gateMeshes[gi] = gm;
      }
    });

    // Dog cage gates
    this.dogs.forEach((dog, di) => {
      if (dog.cageGate) {
        const dg = buildDogGate3D();
        dg.position.set(dog.cageGate.x + 0.5, 0, dog.cageGate.y + 0.5);
        // Orient cage gate based on surrounding fence tiles
        const aboveFence = dog.cageGate.y > 0 && this.map[dog.cageGate.y-1] && this.map[dog.cageGate.y-1][dog.cageGate.x] === T.FENCE;
        const belowFence = dog.cageGate.y < this.map.length-1 && this.map[dog.cageGate.y+1] && this.map[dog.cageGate.y+1][dog.cageGate.x] === T.FENCE;
        if (aboveFence || belowFence) {
          dg.rotation.y = Math.PI / 2;
        }
        scene.add(dg);
        sceneObjects.push(dg);
        gateMeshes['dog_' + di] = dg;
      }
    });

    // Unrescued dogs
    this.dogs.forEach((dog, di) => {
      const dm = buildDog3D(dog.key);
      dm.position.set(dog.x + 0.5, 0, dog.y + 0.5);
      scene.add(dm);
      sceneObjects.push(dm);
      dogMeshes[di] = dm;
    });

    // NPCs
    this.npcs.forEach((npc, ni) => {
      const nm = buildNPC3D(npc.type);
      nm.position.set(npc.x + 0.5, 0, npc.y + 0.5);
      scene.add(nm);
      sceneObjects.push(nm);
      npcMeshes[ni] = nm;
    });
  }

  placeCoinPositions(){
    const coinTiles=new Set([T.GRASS,T.PATH,T.DGRASS,T.TGRASS,T.MUSH,T.SIDEWALK,T.PARK,T.ROAD]);
    const occupied=new Set();
    occupied.add(this.ld.start.x+','+this.ld.start.y);
    this.ld.dogs.forEach(d=>{occupied.add(d.x+','+d.y);if(d.cageGate)occupied.add(d.cageGate.x+','+d.cageGate.y)});
    this.ld.gates.forEach(g=>occupied.add(g.x+','+g.y));
    this.ld.npcs.forEach(n=>occupied.add(n.x+','+n.y));
    const candidates=[];
    for(let y=0;y<this.mh;y++)for(let x=0;x<this.mw;x++){
      if(coinTiles.has(this.map[y][x])&&!occupied.has(x+','+y)&&this.map[y][x]!==T.EXIT&&this.map[y][x]!==T.START)
        candidates.push({x,y});
    }
    // Place coins on ~18% of candidates
    const numCoins=Math.min(Math.max(20,Math.floor(candidates.length*0.18)),60);
    const shuffled=candidates.sort(()=>Math.random()-0.5);
    for(let i=0;i<Math.min(numCoins,shuffled.length);i++){
      this.coins.push({x:shuffled[i].x,y:shuffled[i].y,collected:false});
    }
    this.totalCoins=this.coins.length;
  }

  placeSpeedBoosts(){
    const walkTiles=new Set([T.GRASS,T.PATH,T.DGRASS,T.SIDEWALK,T.PARK]);
    const candidates=[];
    const occupied=new Set();
    this.coins.forEach(c=>occupied.add(c.x+','+c.y));
    occupied.add(this.ld.start.x+','+this.ld.start.y);
    for(let y=0;y<this.mh;y++)for(let x=0;x<this.mw;x++){
      if(walkTiles.has(this.map[y][x])&&!occupied.has(x+','+y))candidates.push({x,y});
    }
    const n=Math.min(3,Math.floor(candidates.length/30));
    const shuffled=candidates.sort(()=>Math.random()-0.5);
    for(let i=0;i<n;i++){
      this.speedBoosts.push({x:shuffled[i].x,y:shuffled[i].y,collected:false});
    }
  }

  build3DCoins(){
    const coinGeo=new THREE.CylinderGeometry(0.12,0.12,0.04,8);
    const coinMat=new THREE.MeshStandardMaterial({color:0xFFD700,emissive:0xFFAA00,emissiveIntensity:0.4,flatShading:true,metalness:0.6,roughness:0.3});
    this.coins.forEach((c,i)=>{
      const m=new THREE.Mesh(coinGeo,coinMat);
      m.position.set(c.x+0.5,0.3,c.y+0.5);
      m.rotation.x=Math.PI/2;
      scene.add(m);sceneObjects.push(m);
      this.coinMeshes.push(m);
    });
  }

  build3DBoosts(){
    const boostGeo=new THREE.OctahedronGeometry(0.15,0);
    const boostMat=new THREE.MeshStandardMaterial({color:0x2196F3,emissive:0x2196F3,emissiveIntensity:0.6,flatShading:true,transparent:true,opacity:0.85});
    this.speedBoosts.forEach((b,i)=>{
      const m=new THREE.Mesh(boostGeo,boostMat);
      m.position.set(b.x+0.5,0.4,b.y+0.5);
      scene.add(m);sceneObjects.push(m);
      this.boostMeshes.push(m);
    });
  }

  build3DButterflies(){
    // Find flower tiles for butterfly spawning
    const flowerTiles=[];
    for(let y=0;y<this.mh;y++)for(let x=0;x<this.mw;x++){
      if(this.map[y][x]===T.FLOWER)flowerTiles.push({x,y});
    }
    const numButterflies=Math.min(5,Math.max(2,Math.floor(flowerTiles.length/3)));
    const colors=[0xFF69B4,0xFFEB3B,0xFF9800,0x9C27B0,0x00BCD4];
    for(let i=0;i<numButterflies;i++){
      const src=flowerTiles.length>0?flowerTiles[Math.floor(Math.random()*flowerTiles.length)]:{x:Math.floor(this.mw/2),y:Math.floor(this.mh/2)};
      const group=new THREE.Group();
      const wingMat=new THREE.MeshStandardMaterial({color:colors[i%5],emissive:colors[i%5],emissiveIntensity:0.3,flatShading:true,transparent:true,opacity:0.8,side:THREE.DoubleSide});
      const wingGeo=new THREE.PlaneGeometry(0.12,0.08);
      const wL=new THREE.Mesh(wingGeo,wingMat);wL.position.set(-0.06,0,0);
      const wR=new THREE.Mesh(wingGeo,wingMat);wR.position.set(0.06,0,0);
      const body=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.08,4),new THREE.MeshStandardMaterial({color:0x333,flatShading:true}));
      body.rotation.x=Math.PI/2;
      group.add(wL,wR,body);
      group.position.set(src.x+0.5,0.6+Math.random()*0.3,src.y+0.5);
      scene.add(group);
      this.butterflies.push({mesh:group,wingL:wL,wingR:wR,cx:src.x+0.5,cz:src.y+0.5,phase:Math.random()*Math.PI*2,speed:0.3+Math.random()*0.3});
    }
  }

  updateCam(instant=false){
    const tx = this.p.px + 0.5;
    const tz = this.p.py + 0.5;
    const targetPos = new THREE.Vector3(tx, 0.5, tz);
    const dx = Math.sin(cameraAngle) * cameraDistance * 0.7;
    const dz = Math.cos(cameraAngle) * cameraDistance * 0.7;
    const desiredCam = new THREE.Vector3(tx + dx, cameraHeight, tz + dz);

    if (instant) {
      camera.position.copy(desiredCam);
    } else {
      camera.position.lerp(desiredCam, 0.08);
    }
    camera.lookAt(targetPos);

    // Reposition quest bubble if active
    if (this.activeQuest && document.getElementById('quest-bubble').style.display === 'block') {
      const gx = this.activeQuest.type === 'dogCage' ? this.activeQuest.x : this.activeQuest.x;
      const gy = this.activeQuest.type === 'dogCage' ? this.activeQuest.y : this.activeQuest.y;
      repositionQuestBubble(gx + 0.5, gy + 0.5);
    }

    // Move shadow camera to follow player
    const sun = scene.children.find(c => c.isDirectionalLight);
    if (sun) {
      sun.position.set(tx + 10, 20, tz + 8);
      sun.target.position.set(tx, 0, tz);
      sun.target.updateMatrixWorld();
    }
  }

  tryMove(dir){
    if(this.p.moving||this.activeQuest)return;
    const dx=dir==='left'?-1:dir==='right'?1:0,dy=dir==='up'?-1:dir==='down'?1:0;
    this.p.dir=dir;
    const nx=this.p.x+dx,ny=this.p.y+dy;
    if(nx<0||ny<0||nx>=this.mw||ny>=this.mh)return;
    const tile=this.map[ny][nx];

    if(tile===T.GATE){
      const g=this.gates.find(g=>g.x===nx&&g.y===ny);
      if(g&&!g.open){this.openGateQuest(g);return}
      if(g&&g.open){this.doMove(nx,ny);return}
      return;
    }

    if(tile===T.DOG_GATE){
      const nearDog=this.dogs.find(d=>!d.rescued&&d.cageGate&&d.cageGate.x===nx&&d.cageGate.y===ny);
      if(nearDog&&!nearDog.cageOpen){
        if(!nearDog.quests)nearDog.quests=genQuests(1,this.ld.diff);
        const story=CAGE_STORIES[Math.floor(Math.random()*CAGE_STORIES.length)];
        this.activeQuest={type:'dogCage',dog:nearDog,x:nx,y:ny};
        this.questList=nearDog.quests;this.questIdx=0;
        this.addBurst(nx+0.5,0.5,ny+0.5,8,'#FF9800');
        showQuestBubble(this.questList[0],story,nx+0.5,ny+0.5);
        return;
      }
      if(nearDog&&nearDog.cageOpen){this.doMove(nx,ny);return}
      this.doMove(nx,ny);return;
    }

    if(tile===T.DOG){
      const dog=this.dogs.find(d=>d.x===nx&&d.y===ny&&!d.rescued);
      if(dog){
        dog.rescued=true;dog.rescueAnim=60;
        dog.followX=this.p.px;dog.followY=this.p.py;
        this.rescued.push(dog);
        this.map[ny][nx]=T.GRASS;
        sfxRescue();
        this.addBurst(nx+0.5,0.5,ny+0.5,25,'#FFD700');
        this.addBurst(nx+0.5,0.3,ny+0.5,15,DOGS[dog.key]?.bodyColor||'#FF9800');
        // Hide the dog mesh, create following version
        const di = this.dogs.indexOf(dog);
        if (dogMeshes[di]) { dogMeshes[di].visible = false; }
        const followDog = buildDog3D(dog.key);
        followDog.position.set(this.p.px + 0.5, 0, this.p.py + 0.5);
        scene.add(followDog);
        sceneObjects.push(followDog);
        rescuedDogMeshes.push({mesh: followDog, dog: dog});
        // Celebration!
        this.showRescueCelebration(dog);
        sfxDogBark();
        // Make all other rescued dogs jump
        rescuedDogMeshes.forEach(rd=>{rd.dog.rescueAnim=25;});
        // Bonus coins for rescue
        this.coinsCollected+=5;
        document.getElementById('hud-coins').textContent=this.coinsCollected;
        showFlash('🐕 '+dog.name+' rescued! +5 🪙','#4CAF50');
        this.doMove(nx,ny);
        return;
      }
      this.map[ny][nx]=T.GRASS;
    }

    if(INTERACT.has(tile)){this.interactWith(nx,ny,tile);return}
    if(!WALKABLE.has(tile))return;

    if(tile===T.EXIT){
      if(this.rescued.length>=this.totalDogs){this.complete();return}
      else{const rem=this.totalDogs-this.rescued.length;showFlash(t('find_dogs',rem),'#FF9800');return}
    }

    this.doMove(nx,ny);
  }

  doMove(nx,ny){
    this.p.tx=nx;this.p.ty=ny;this.p.moving=true;this.p.frame++;
    this.p.idleT=0;sfxStep();
    // Update fog of war
    for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
      const vx=nx+dx,vy=ny+dy;
      if(vx>=0&&vy>=0&&vx<this.mw&&vy<this.mh)this.visited.add(vx+','+vy);
    }
    // Check coin pickup
    const ci=this.coins.findIndex(c=>c.x===nx&&c.y===ny&&!c.collected);
    if(ci>=0){
      this.coins[ci].collected=true;this.coinsCollected++;
      sfxCoin();
      if(this.coinMeshes[ci]){scene.remove(this.coinMeshes[ci]);this.coinMeshes[ci].visible=false;}
      this.addBurst(nx+0.5,0.4,ny+0.5,6,'#FFD700');
      // Animate HUD coin counter
      const coinEl=document.getElementById('hud-coins');
      if(coinEl){coinEl.textContent=this.coinsCollected;coinEl.parentElement.classList.add('coin-pop');
        setTimeout(()=>coinEl.parentElement.classList.remove('coin-pop'),300);}
      // Floating +1
      showFlash('🪙 +1','#FFD700');
    }
    // Check speed boost pickup
    const bi=this.speedBoosts.findIndex(b=>b.x===nx&&b.y===ny&&!b.collected);
    if(bi>=0){
      this.speedBoosts[bi].collected=true;
      sfxSpeedBoost();
      if(this.boostMeshes[bi]){scene.remove(this.boostMeshes[bi]);this.boostMeshes[bi].visible=false;}
      this.boostActive=true;this.boostTimer=480; // 8 seconds at 60fps
      this.addBurst(nx+0.5,0.5,ny+0.5,12,'#2196F3');
      showFlash('⚡ '+t('speed_boost'),'#2196F3');
      document.getElementById('hud-boost').style.display='flex';
    }
  }

  interactWith(x,y,tile){
    const npc=this.npcs.find(n=>n.x===x&&n.y===y);
    if(!npc)return;
    sfxBubble();
    const npcIdx=this.npcs.indexOf(npc);
    const storyNpc=getLevelNPC(this.li,npcIdx);
    let name,portrait,text;
    if(storyNpc){
      const charData=STORY.npcs[storyNpc.char];
      portrait=charData?charData.portrait:'❓';
      name=(charData?charData.name[LANG]||charData.name.en:storyNpc.char);
      const key=this.li+'_'+npcIdx;
      if(!storyState.npcTalkCount[key])storyState.npcTalkCount[key]=0;
      const lineIdx=storyState.npcTalkCount[key]%storyNpc.lines.length;
      text=storyNpc.lines[lineIdx];
      storyState.npcTalkCount[key]++;
    } else {
      const fallbackNames={[T.NPC_BUT]:'Butterfly',[T.NPC_SQU]:'Squirrel',[T.NPC_BEAR]:'Bear',[T.NPC_BIRD]:'Bird'};
      const fallbackPortraits={[T.NPC_BUT]:'🦋',[T.NPC_SQU]:'🐿️',[T.NPC_BEAR]:'🐻',[T.NPC_BIRD]:'🐦'};
      name=fallbackNames[tile]||'???';portrait=fallbackPortraits[tile]||'❓';
      text=t(Math.random()>0.4?'npc_hint':'npc_hello');
    }
    // Project 3D position to screen
    const screen = worldToScreen(x + 0.5, y + 0.5);
    showSpeechBubble(portrait+' '+name,text,screen.x,screen.y);
  }

  openGateQuest(gate){
    if(!gate.quests)gate.quests=genQuests(1,gate.d);
    this.activeQuest=gate;this.questList=gate.quests;this.questIdx=0;
    this.addBurst(gate.x+0.5,0.5,gate.y+0.5,8,'#FFD700');
    const biome=this.ld.biome||'meadow';
    const stories=QUEST_STORIES[biome]||QUEST_STORIES.meadow;
    const story=stories[Math.floor(Math.random()*stories.length)];
    showQuestBubble(this.questList[0],story,gate.x+0.5,gate.y+0.5);
  }

  questAnswered(correct){
    if(!correct){
      this.mistakes++;
      if(this.streak>=2)showFlash('💔 Streak lost!','#f44336');
      this.streak=0;
      document.getElementById('hud-streak').style.display='none';
      return false;
    }
    // Streak system
    this.streak++;
    if(this.streak>this.bestStreak)this.bestStreak=this.streak;
    if(this.streak>=2){
      const streakEl=document.getElementById('hud-streak');
      streakEl.style.display='flex';
      document.getElementById('hud-streak-text').textContent='🔥 '+this.streak+'x';
      if(this.streak>=5){
        sfxSuperStreak();
        this.showStreakFlash('⚡ '+t('super_streak')+' ⚡');
        this.addBurst(this.p.px+0.5,0.8,this.p.py+0.5,30,'#FF5722');
        this.coinsCollected+=this.streak*2;
        document.getElementById('hud-coins').textContent=this.coinsCollected;
        showFlash('🪙 +'+this.streak*2+' bonus coins!','#FF5722');
      }else if(this.streak>=3){
        sfxStreak(this.streak);
        this.showStreakFlash('🔥🔥 '+this.streak+'x Streak!');
        this.coinsCollected+=this.streak;
        document.getElementById('hud-coins').textContent=this.coinsCollected;
      }else{
        sfxStreak(this.streak);
        this.showStreakFlash('🔥 '+this.streak+'x Streak!');
      }
    }
    // Single quest per gate/cage — immediately complete
    if(this.activeQuest.type==='dogCage'){
      const dog=this.activeQuest.dog;
      const gx=this.activeQuest.x,gy=this.activeQuest.y;
      dog.cageOpen=true;
      this.map[gy][gx]=T.GRASS;
      for(let fdy=-1;fdy<=1;fdy++)for(let fdx=-1;fdx<=1;fdx++){
        const fy2=dog.y+fdy,fx2=dog.x+fdx;
        if(fy2>=0&&fy2<this.mh&&fx2>=0&&fx2<this.mw&&this.map[fy2][fx2]===T.FENCE){
          this.map[fy2][fx2]=T.GRASS;
        }
      }
      const di = this.dogs.indexOf(dog);
      const dgMesh = gateMeshes['dog_' + di];
      if (dgMesh) { scene.remove(dgMesh); dgMesh.visible = false; }
      this.rebuildFences();
      this.activeQuest=null;this.questList=null;
      sfxGateOpen();hideQuestBubble();
      this.addBurst(gx+0.5,0.5,gy+0.5,25,'#FF9800');
      this.addBurst(dog.x+0.5,0.5,dog.y+0.5,20,'#FFD700');
      showFlash('🔓 '+dog.name+': "'+getDogRescueMessage()+'"','#FF9800');
      return true;
    }
    // Gate solved
    const gx=this.activeQuest.x,gy=this.activeQuest.y;
    this.activeQuest.open=true;
    this.activeQuest.openAnim=30;
    this.map[gy][gx]=T.PATH;
    const gi = this.gates.indexOf(this.activeQuest);
    const gMesh = gateMeshes[gi];
    if (gMesh) {
      gMesh.userData._opening = true;
      gMesh.userData._openProgress = 0;
    }
    this.activeQuest=null;this.questList=null;
    sfxGateOpen();hideQuestBubble();
    this.addBurst(gx+0.5,0.8,gy+0.5,30,'#FFD700');
    showFlash('✨ Gate opened! ✨','#4CAF50');
    const allGatesOpen=this.gates.every(g2=>g2.open);
    if(allGatesOpen){
      setTimeout(()=>{
        const defeats=I18N[LANG]?.zahlix_defeat||I18N.en.zahlix_defeat;
        const msg=defeats[Math.floor(Math.random()*defeats.length)];
        sfxZahlix();
        showFlash('🧙‍♂️ Prof. Zählix: "'+msg+'"','#7B1FA2');
      },800);
    }
    return true;
  }

  rebuildFences() {
    // Remove existing fence instanced meshes (posts and rails)
    sceneObjects = sceneObjects.filter(o => {
      if (o.userData && o.userData.isFence && o.isInstancedMesh) {
        scene.remove(o);
        return false;
      }
      return true;
    });
    // Count remaining fences
    let fCount = 0;
    const fenceRails = [];
    for (let r = 0; r < this.mh; r++) for (let c = 0; c < this.mw; c++) {
      if (this.map[r][c] === T.FENCE) { fCount++; fenceRails.push({x: c + 0.5, z: r + 0.5}); }
    }
    if (fCount > 0) {
      const fIM = new THREE.InstancedMesh(GEO.fence, MAT.fence, fCount);
      fIM.castShadow = true;
      fIM.userData.isFence = true;
      let fi = 0;
      const m4 = new THREE.Matrix4();
      for (const f of fenceRails) {
        m4.makeTranslation(f.x, 0.2, f.z);
        fIM.setMatrixAt(fi++, m4);
      }
      fIM.instanceMatrix.needsUpdate = true;
      scene.add(fIM);
      sceneObjects.push(fIM);

      // Rebuild rails
      const fSet = new Set(fenceRails.map(f => f.x + ',' + f.z));
      const railPairs = [];
      for (const f of fenceRails) {
        if (fSet.has((f.x + 1) + ',' + f.z)) railPairs.push({x: f.x + 0.5, z: f.z, rot: 0});
        if (fSet.has(f.x + ',' + (f.z + 1))) railPairs.push({x: f.x, z: f.z + 0.5, rot: Math.PI/2});
      }
      if (railPairs.length > 0) {
        const railIM = new THREE.InstancedMesh(GEO.fenceRail, MAT.fence, railPairs.length * 2);
        railIM.userData.isFence = true;
        let ri = 0;
        const rm = new THREE.Matrix4(), rq = new THREE.Quaternion(), rv = new THREE.Vector3();
        for (const rp of railPairs) {
          rq.setFromEuler(new THREE.Euler(0, rp.rot, 0));
          rv.set(rp.x, 0.32, rp.z); rm.compose(rv, rq, new THREE.Vector3(1,1,1)); railIM.setMatrixAt(ri++, rm);
          rv.set(rp.x, 0.15, rp.z); rm.compose(rv, rq, new THREE.Vector3(1,1,1)); railIM.setMatrixAt(ri++, rm);
        }
        railIM.instanceMatrix.needsUpdate = true;
        scene.add(railIM);
        sceneObjects.push(railIM);
      }
    }
  }

  showStreakFlash(text){
    const el=document.createElement('div');el.className='streak-flash';el.textContent=text;
    document.body.appendChild(el);setTimeout(()=>el.remove(),1200);
  }

  showRescueCelebration(dog){
    const el=document.createElement('div');el.className='rescue-celebration';
    el.innerHTML='🐕 '+t('rescued_dog',dog.name)+'<br>🎉🎉🎉';
    document.body.appendChild(el);setTimeout(()=>el.remove(),2500);
  }

  update(){
    this.fc++;globalFC=this.fc;animF=Math.floor(this.fc/15);
    const spd = this.boostActive ? 0.6 : 0.35;

    // Player movement (lerp toward target tile)
    if(this.p.moving){
      const tx=this.p.tx,ty=this.p.ty;
      const dx=tx-this.p.px,dy=ty-this.p.py,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<spd){this.p.px=tx;this.p.py=ty;this.p.x=this.p.tx;this.p.y=this.p.ty;this.p.moving=false}
      else{this.p.px+=(dx/dist)*spd;this.p.py+=(dy/dist)*spd}
    }else{
      this.p.idleT++;
    }
    if(!this.p.moving&&this.moveHeld&&this.moveDir){this.moveCD--;if(this.moveCD<=0){this.tryMove(this.moveDir);this.moveCD=2}}

    // Auto-trigger quest when adjacent to gate/cage
    if(!this.p.moving&&!this.activeQuest){
      const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
      for(const[ddx,ddy] of dirs){
        const ax=this.p.x+ddx,ay=this.p.y+ddy;
        if(ax<0||ay<0||ax>=this.mw||ay>=this.mh)continue;
        const t2=this.map[ay][ax];
        if(t2===T.GATE){
          const g=this.gates.find(g2=>g2.x===ax&&g2.y===ay&&!g2.open);
          if(g&&!g.autoTriggered){g.autoTriggered=true;this.openGateQuest(g);break}
        }
        if(t2===T.DOG_GATE){
          const nd=this.dogs.find(d=>!d.rescued&&d.cageGate&&d.cageGate.x===ax&&d.cageGate.y===ay&&!d.cageOpen);
          if(nd&&!nd.autoTriggered){
            nd.autoTriggered=true;
            if(!nd.quests)nd.quests=genQuests(1,this.ld.diff);
            const story=CAGE_STORIES[Math.floor(Math.random()*CAGE_STORIES.length)];
            this.activeQuest={type:'dogCage',dog:nd,x:ax,y:ay};
            this.questList=nd.quests;this.questIdx=0;
            this.addBurst(ax+0.5,0.5,ay+0.5,8,'#FF9800');
            showQuestBubble(this.questList[0],story,ax+0.5,ay+0.5);break;
          }
        }
      }
    }

    // Dog following
    let prevX=this.p.px,prevY=this.p.py;
    for(const dog of this.rescued){
      const tdx=prevX-dog.followX,tdy=prevY-dog.followY;
      const dd=Math.sqrt(tdx*tdx+tdy*tdy);
      if(dd>1.2){dog.followX+=tdx*0.08;dog.followY+=tdy*0.08}
      prevX=dog.followX;prevY=dog.followY;
      if(dog.rescueAnim>0)dog.rescueAnim--;
    }

    // 3D Particles
    this.particles=this.particles.filter(p=>{
      p.life--;
      p.mesh.position.x+=p.vx;
      p.mesh.position.y+=p.vy;
      p.mesh.position.z+=p.vz;
      p.vy-=0.005;
      const s=Math.max(0.01, p.life/p.maxLife);
      p.mesh.scale.set(s,s,s);
      if(p.life<=0){scene.remove(p.mesh);return false}
      return true;
    });

    // Gate open animations
    Object.values(gateMeshes).forEach(gm => {
      if (gm.userData._opening && gm.userData._openProgress < 1) {
        gm.userData._openProgress += 0.03;
        const bar = gm.userData.bar;
        if (bar) {
          bar.rotation.x = -gm.userData._openProgress * Math.PI / 2;
          bar.position.y = 1.05 + gm.userData._openProgress * 0.25;
        }
        if (gm.userData._openProgress >= 1) {
          gm.userData._opening = false;
        }
      }
    });

    // NPC bobbing & wing flapping
    this.npcs.forEach((n, ni) => {
      n.bobT += 0.03;
      const nm = npcMeshes[ni];
      if (nm) {
        nm.position.y = Math.sin(n.bobT) * 0.05;
        if (nm.userData.wingL) {
          nm.userData.wingL.rotation.y = 0.3 + Math.sin(this.fc * 0.15) * 0.5;
          nm.userData.wingR.rotation.y = -0.3 - Math.sin(this.fc * 0.15) * 0.5;
        }
        if (nm.userData.tail) {
          nm.userData.tail.rotation.y = Math.sin(this.fc * 0.1) * 0.3;
        }
        // Bob floating marker
        if (nm.userData.marker) {
          nm.userData.marker.position.y = 0.85 + Math.sin(this.fc * 0.06 + ni) * 0.08;
        }
      }
    });

    // Unrescued dog animations (bounce exclamation in 3D = bob)
    this.dogs.forEach((dog, di) => {
      if (!dog.rescued && dogMeshes[di]) {
        const dm = dogMeshes[di];
        dm.position.y = Math.sin(this.fc * 0.04) * 0.05;
        if (dm.userData.tail) {
          dm.userData.tail.rotation.y = Math.sin(this.fc * 0.15) * 0.5;
        }
        // Bob marker
        if (dm.userData.marker) {
          dm.userData.marker.position.y = 0.7 + Math.sin(this.fc * 0.08 + di) * 0.08;
        }
      }
    });

    // Gates open anim countdown (2D effects)
    this.gates.forEach(g=>{if(g.openAnim>0)g.openAnim--});

    // ===== UPDATE 3D OBJECTS =====

    // Player position & animation
    if (playerGroup) {
      const targetX = this.p.px + 0.5;
      const targetZ = this.p.py + 0.5;
      playerGroup.position.x = targetX;
      playerGroup.position.z = targetZ;

      // Face direction
      const dirAngles = {down: 0, left: Math.PI/2, up: Math.PI, right: -Math.PI/2};
      const targetAngle = dirAngles[this.p.dir] || 0;
      // Smooth rotation
      let diff = targetAngle - playerGroup.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      playerGroup.rotation.y += diff * 0.3;

      // Walk animation
      if (this.p.moving) {
        const walk = Math.sin(this.fc * 0.25) * 0.35;
        playerGroup.position.y = Math.abs(Math.sin(this.fc * 0.25)) * 0.03;
        if (playerGroup.userData.armL) playerGroup.userData.armL.rotation.x = walk;
        if (playerGroup.userData.armR) playerGroup.userData.armR.rotation.x = -walk;
        if (playerGroup.userData.legL) playerGroup.userData.legL.rotation.x = -walk * 0.6;
        if (playerGroup.userData.legR) playerGroup.userData.legR.rotation.x = walk * 0.6;
      } else {
        // Idle bob
        playerGroup.position.y = Math.sin(this.fc * 0.04) * 0.01;
        if (playerGroup.userData.armL) playerGroup.userData.armL.rotation.x *= 0.9;
        if (playerGroup.userData.armR) playerGroup.userData.armR.rotation.x *= 0.9;
        if (playerGroup.userData.legL) playerGroup.userData.legL.rotation.x *= 0.9;
        if (playerGroup.userData.legR) playerGroup.userData.legR.rotation.x *= 0.9;
      }
    }

    // Rescued dogs following
    rescuedDogMeshes.forEach((rd, i) => {
      const dog = rd.dog;
      const mesh = rd.mesh;
      mesh.position.x = dog.followX + 0.5;
      mesh.position.z = dog.followY + 0.5;
      let bounce = 0;
      if (dog.rescueAnim && dog.rescueAnim > 0) {
        bounce = Math.sin(dog.rescueAnim * 0.3) * 0.15 * (dog.rescueAnim / 40);
      }
      mesh.position.y = bounce + Math.sin(this.fc * 0.04 + i) * 0.02;
      // Tail wag
      if (mesh.userData.tail) {
        mesh.userData.tail.rotation.y = Math.sin(this.fc * 0.2 + i) * 0.5;
      }
      // Face toward player
      const dx2 = (this.p.px + 0.5) - mesh.position.x;
      const dz2 = (this.p.py + 0.5) - mesh.position.z;
      if (Math.abs(dx2) + Math.abs(dz2) > 0.1) {
        mesh.rotation.y = Math.atan2(dx2, dz2);
      }
    });

    // Water animation (InstancedMesh — simple Y oscillation of entire batch)
    const time = this.fc * 0.02;
    waterMeshes.forEach(wm => {
      wm.position.y = Math.sin(time * 0.8) * 0.015;
    });

    // Exit platform glow
    if (exitMesh) {
      exitMesh.rotation.y = this.fc * 0.01;
      exitMesh.position.y = 0.04 + Math.sin(this.fc * 0.05) * 0.02;
    }

    // === ENGAGEMENT UPDATES ===

    // Coin spinning animation
    this.coinMeshes.forEach((m,i)=>{
      if(m&&m.visible){
        m.rotation.z=this.fc*0.05;
        m.position.y=0.3+Math.sin(this.fc*0.04+i)*0.06;
      }
    });

    // Speed boost crystal spinning
    this.boostMeshes.forEach((m,i)=>{
      if(m&&m.visible){
        m.rotation.y=this.fc*0.06;m.rotation.x=this.fc*0.03;
        m.position.y=0.4+Math.sin(this.fc*0.05+i)*0.08;
      }
    });

    // Speed boost timer
    if(this.boostActive){
      this.boostTimer--;
      const secs=Math.ceil(this.boostTimer/60);
      document.getElementById('hud-boost-time').textContent=secs;
      // Blue trail particles
      if(this.p.moving&&this.fc%3===0){
        this.addBurst(this.p.px+0.5,0.15,this.p.py+0.5,2,'#2196F3');
      }
      if(this.boostTimer<=0){
        this.boostActive=false;
        document.getElementById('hud-boost').style.display='none';
        showFlash('⚡ Speed boost ended','#666');
      }
    }

    // Butterfly animation
    this.butterflies.forEach(b=>{
      const t2=this.fc*0.02;
      b.mesh.position.x=b.cx+Math.sin(t2*b.speed+b.phase)*3;
      b.mesh.position.z=b.cz+Math.cos(t2*b.speed*0.7+b.phase)*3;
      b.mesh.position.y=0.6+Math.sin(t2*2+b.phase)*0.15;
      // Wing flap
      b.wingL.rotation.y=Math.sin(this.fc*0.3+b.phase)*0.6;
      b.wingR.rotation.y=-Math.sin(this.fc*0.3+b.phase)*0.6;
      // Face movement direction
      b.mesh.rotation.y=t2*b.speed+b.phase+Math.PI/2;
    });

    // Tree canopy sway (subtle)
    sceneObjects.forEach(o=>{
      if(o&&o.isInstancedMesh&&o.userData&&o.userData.isCanopy){
        // Can't easily sway instanced meshes per-instance, skip
      }
    });

    // Rescued dog barking
    if(this.rescued.length>0){
      this.barkTimer--;
      if(this.barkTimer<=0){
        sfxDogBark();
        this.barkTimer=200+Math.floor(Math.random()*200);
        // Random rescued dog does a little jump
        if(rescuedDogMeshes.length>0){
          const rd=rescuedDogMeshes[Math.floor(Math.random()*rescuedDogMeshes.length)];
          rd.dog.rescueAnim=15;
        }
      }
    }

    // NPC facing player when nearby
    this.npcs.forEach((n,ni)=>{
      const nm=npcMeshes[ni];
      if(nm){
        const dist=Math.abs(n.x-this.p.x)+Math.abs(n.y-this.p.y);
        if(dist<=4){
          const dx2=(this.p.px+0.5)-(n.x+0.5),dz2=(this.p.py+0.5)-(n.y+0.5);
          const targetRot=Math.atan2(dx2,dz2);
          let diff2=targetRot-nm.rotation.y;
          while(diff2>Math.PI)diff2-=Math.PI*2;
          while(diff2<-Math.PI)diff2+=Math.PI*2;
          nm.rotation.y+=diff2*0.05;
        }
      }
    });

    // HUD
    const el=Math.floor((Date.now()-this.startTime)/1000);
    document.getElementById('hud-timer').textContent=Math.floor(el/60)+':'+(el%60).toString().padStart(2,'0');
    document.getElementById('hud-dogs').textContent=this.rescued.length+'/'+this.totalDogs;
    document.getElementById('hud-coins').textContent=this.coinsCollected;

    this.updateCam();
  }

  addBurst(x, y, z, n, color) {
    const c = new THREE.Color(color);
    for (let i = 0; i < Math.min(n, 20); i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.02 + Math.random() * 0.05;
      const pMat = new THREE.MeshBasicMaterial({color: c});
      const pMesh = new THREE.Mesh(GEO.particle, pMat);
      pMesh.position.set(x, y, z);
      scene.add(pMesh);
      this.particles.push({
        mesh: pMesh,
        vx: Math.cos(angle) * speed,
        vy: 0.02 + Math.random() * 0.03,
        vz: Math.sin(angle) * speed,
        life: 25 + Math.random() * 25,
        maxLife: 50
      });
    }
  }

  renderMinimap() {
    const mc = document.getElementById('minimap-canvas');
    if (!mc) return;
    const mmS = Math.min(160 / this.mw, 120 / this.mh, 2);
    mc.width = Math.round(this.mw * mmS);
    mc.height = Math.round(this.mh * mmS);
    const mx = mc.getContext('2d');
    mx.fillStyle = '#111';
    mx.fillRect(0, 0, mc.width, mc.height);
    for (let r = 0; r < this.mh; r++) for (let c = 0; c < this.mw; c++) {
      // Fog of war — only show visited tiles
      if(!this.visited.has(c+','+r)){
        // Show faint outline for adjacent-to-visited
        let adj=false;
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
          if(this.visited.has((c+dx)+','+(r+dy)))adj=true;
        }
        if(adj){mx.fillStyle='rgba(40,40,40,0.8)';mx.fillRect(c*mmS,r*mmS,mmS,mmS)}
        continue;
      }
      const tile = this.map[r][c];
      const rgb = TILE_COLORS[tile] || [0x7c, 0xb3, 0x42];
      mx.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
      mx.fillRect(c * mmS, r * mmS, mmS, mmS);
    }
    // Coins (tiny gold dots)
    mx.fillStyle='#FFD700';
    this.coins.forEach(c=>{
      if(!c.collected&&this.visited.has(c.x+','+c.y)){
        mx.fillRect(c.x*mmS,c.y*mmS,Math.max(1,mmS*0.6),Math.max(1,mmS*0.6));
      }
    });
    // Gates (gold)
    mx.fillStyle='#DAA520';
    this.gates.forEach(g=>{if(!g.open)mx.fillRect(g.x*mmS-0.5,g.y*mmS-0.5,mmS+1,mmS+1)});
    // Unrescued dogs (orange)
    mx.fillStyle='#FF9800';
    this.dogs.forEach(d=>{if(!d.rescued&&this.visited.has(d.x+','+d.y))mx.fillRect(d.x*mmS-0.5,d.y*mmS-0.5,mmS+1,mmS+1)});
    // Exit (green, pulsing)
    let exitPos=null;
    for(let r=0;r<this.mh&&!exitPos;r++)for(let c=0;c<this.mw;c++){
      if(this.map[r][c]===T.EXIT){exitPos={x:c,y:r};break;}
    }
    if(exitPos){
      mx.fillStyle=this.fc%30<15?'#4CAF50':'#66BB6A';
      mx.fillRect(exitPos.x*mmS-1,exitPos.y*mmS-1,mmS+2,mmS+2);
    }
    // Rescued dogs (pink)
    mx.fillStyle='#ff69b4';
    this.rescued.forEach(d => {
      mx.fillRect(Math.round(d.followX) * mmS, Math.round(d.followY) * mmS, mmS, mmS);
    });
    // Player (red, larger)
    mx.fillStyle = '#ff0000';
    mx.fillRect(this.p.x * mmS - 1, this.p.y * mmS - 1, mmS + 2, mmS + 2);
  }

  complete(){
    const el=Math.floor((Date.now()-this.startTime)/1000);
    const stars=this.mistakes===0?3:this.mistakes<=2?2:1;
    saveRecord(this.li,el,stars,this.mistakes);
    const li=this.li,rescued=this.rescued,mistakes=this.mistakes;
    const coins=this.coinsCollected,totalCoins=this.totalCoins,bestStreak=this.bestStreak;
    // Epic celebration!
    sfxFanfare();
    this.addBurst(this.p.px+0.5,1,this.p.py+0.5,40,'#FFD700');
    this.addBurst(this.p.px+0.5,0.5,this.p.py+0.5,30,'#4CAF50');
    this.addBurst(this.p.px+0.5,0.3,this.p.py+0.5,20,'#2196F3');
    // All dogs jump
    rescuedDogMeshes.forEach(rd=>{rd.dog.rescueAnim=40;});
    setTimeout(()=>{
      showLevelOutro(li,()=>showVictory(rescued,el,mistakes,stars,li,coins,totalCoins,bestStreak));
    },1000);
  }
}

function worldToScreen(wx, wz) {
  const vec = new THREE.Vector3(wx, 1.5, wz);
  vec.project(camera);
  return {
    x: (vec.x * 0.5 + 0.5) * window.innerWidth,
    y: (-vec.y * 0.5 + 0.5) * window.innerHeight
  };
}

function showQuestUI(quests,idx,total){
  try{

  if(!ov||!body||!quests||!quests[idx]){console.error('showQuestUI: missing data',{ov:!!ov,body:!!body,quests:quests?.length,idx});return}
  document.getElementById('quest-title').textContent=t('math_challenge');

  ov.classList.add('active');body.innerHTML='';

function renderPattern(body,q){
  const title=document.createElement('p');
  title.style.cssText='font-weight:700;font-size:1rem;margin-bottom:12px;color:#333';
  title.textContent=t('pattern_title');body.appendChild(title);
  const ser=document.createElement('div');ser.className='pattern-series';
  let cur=0;
  function draw(){ser.innerHTML='';q.series.forEach((item,i)=>{
    const row=document.createElement('div');
    row.className='pattern-row'+(i===cur?' current':'')+(i<cur?' solved':'');
    const eq=document.createElement('span');eq.className='pattern-eq';eq.textContent=item.eq;row.appendChild(eq);
    if(i<cur){const a=document.createElement('span');a.className='pattern-answer pattern-eq';a.textContent=item.ans;a.style.color='#2e7d32';row.appendChild(a)}
    else if(i===cur){
      const inp=document.createElement('input');inp.type='number';inp.className='pattern-input';inp.inputMode='numeric';row.appendChild(inp);
      const btn=document.createElement('button');btn.className='num-submit';btn.textContent=t('submit');
      btn.onclick=()=>check(inp,item);inp.addEventListener('keydown',e=>{if(e.key==='Enter')check(inp,item)});
      row.appendChild(btn);setTimeout(()=>inp.focus(),150)}
    ser.appendChild(row)});}
  function check(inp,item){
    if(parseInt(inp.value)===item.ans){sfxCorrect();cur++;
      if(cur>=q.series.length){draw();setTimeout(()=>{if(game)game.questAnswered(true)},600)}else draw()
    }else{sfxWrong();if(game)game.mistakes++;
      inp.style.borderColor='#f44336';inp.style.background='#ffebee';inp.style.animation='shake 0.3s';
      setTimeout(()=>{inp.style.borderColor='#4CAF50';inp.style.background='';inp.style.animation='';inp.value='';inp.focus()},500)}}
  body.appendChild(ser);draw();
}

      else{btn.classList.add('wrong');sfxWrong();if(game)game.mistakes++;att++;

        setTimeout(()=>{grid.querySelectorAll('.mc-btn').forEach(b=>{b.disabled=false;b.classList.remove('wrong','correct')})},800)}};
    grid.appendChild(btn)});body.appendChild(grid);

// ===== QUEST BUBBLE SYSTEM =====
let _questBubbleGatePos = null;

function showQuestBubble(quest, storyText, gateWX, gateWZ) {
  _questBubbleGatePos = {wx: gateWX, wz: gateWZ};
  const bubble = document.getElementById('quest-bubble');
  const storyEl = document.getElementById('quest-story');
  const bodyEl = document.getElementById('quest-bubble-body');
  storyEl.textContent = storyText;
  bodyEl.innerHTML = '';
  
  // Render quest content into bubble
  renderQuestInBubble(bodyEl, quest);
  
  bubble.style.display = 'block';
  bubble.classList.add('active');
  repositionQuestBubble(gateWX, gateWZ);
}

function hideQuestBubble() {
  const bubble = document.getElementById('quest-bubble');
  bubble.classList.remove('active');
  bubble.style.display = 'none';
  _questBubbleGatePos = null;
}

function repositionQuestBubble(wx, wz) {
  const bubble = document.getElementById('quest-bubble');
  if (!bubble || bubble.style.display !== 'block') return;
  const screen = worldToScreen(wx, wz);
  const bw = Math.min(380, window.innerWidth - 20);
  const bh = bubble.offsetHeight || 200;
  let left = Math.max(10, Math.min(window.innerWidth - bw - 10, screen.x - bw / 2));
  let top = Math.max(10, screen.y - bh - 30);
  // If too high, put below
  if (top < 10) top = screen.y + 20;
  bubble.style.left = left + 'px';
  bubble.style.top = top + 'px';
  bubble.style.width = bw + 'px';
  // Position tail
  const tail = bubble.querySelector('.quest-bubble-tail');
  if (tail) {
    const tailX = Math.max(20, Math.min(bw - 20, screen.x - left));
    tail.style.left = tailX + 'px';
    tail.style.transform = 'translateX(-50%)';
  }
}

function renderQuestInBubble(body, q) {
  if (q.type === 'pattern') renderPattern(body, q);
  else if (q.type === 'choice') renderChoice(body, q);
  else if (q.type === 'input') renderInput(body, q);
  else if (q.type === 'truefalse') renderTF2(body, q);
  else if (q.type === 'compare') renderCompare(body, q);
  else if (q.type === 'counting') renderCounting(body, q);
  else if (q.type === 'estimation') renderEstimation(body, q);
  else if (q.type === 'bonds') renderBonds(body, q);
  else renderChoice(body, q); // fallback
}

function renderCompare(body, q) {
  const title = document.createElement('p');
  title.style.cssText = 'font-weight:700;text-align:center;margin-bottom:12px;color:#333;font-size:1rem';
  title.textContent = '🤔 Which is bigger?';
  body.appendChild(title);
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:10px;justify-content:center';
  let att = 0;
  ['A', 'B'].forEach(side => {
    const btn = document.createElement('button');
    btn.className = 'mc-btn';
    btn.style.cssText = 'flex:1;padding:14px 8px;font-size:1.1rem;min-height:60px';
    btn.textContent = side === 'A' ? q.exprA : q.exprB;
    btn.onclick = () => {
      row.querySelectorAll('.mc-btn').forEach(b => b.disabled = true);
      if (side === q.ans) {
        btn.classList.add('correct');
        sfxCorrect();
        setTimeout(() => { if (game) game.questAnswered(true) }, 600);
      } else {
        btn.classList.add('wrong'); sfxWrong(); if (game) game.mistakes++; att++;
        if (att >= 2) {
          row.querySelectorAll('.mc-btn').forEach(b => { if ((b.textContent === q.exprA && q.ans === 'A') || (b.textContent === q.exprB && q.ans === 'B')) b.classList.add('correct') });
          setTimeout(() => { if (game) game.questAnswered(true) }, 1500);
        } else {
          setTimeout(() => { row.querySelectorAll('.mc-btn').forEach(b => { b.disabled = false; b.classList.remove('wrong', 'correct') }) }, 800);
        }
      }
    };
    row.appendChild(btn);
  });
  body.appendChild(row);
}

function renderCounting(body, q) {
  const title = document.createElement('p');
  title.style.cssText = 'font-weight:700;text-align:center;margin-bottom:8px;color:#333;font-size:1rem';
  title.textContent = '🔢 How many ' + q.emoji + ' do you see?';
  body.appendChild(title);
  // Grid of emojis
  const grid = document.createElement('div');
  grid.style.cssText = 'text-align:center;font-size:1.3rem;line-height:2;letter-spacing:4px;margin:8px 0 12px;padding:8px;background:#f5f5f5;border-radius:10px';
  let emojis = '';
  for (let i = 0; i < q.count; i++) emojis += q.emoji + ' ';
  grid.textContent = emojis.trim();
  body.appendChild(grid);
  // Input
  const r2 = document.createElement('div'); r2.className = 'num-input-row'; r2.style.marginTop = '8px';
  const inp = document.createElement('input'); inp.type = 'number'; inp.className = 'num-input'; inp.inputMode = 'numeric'; r2.appendChild(inp);
  const btn = document.createElement('button'); btn.className = 'num-submit'; btn.textContent = t('submit');
  let att = 0;
  function check() {

// ===== RECORDS =====
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('AdaMathQuestDB',1);
  r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'li'})};
  r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=e=>rej(e)})}
function saveRecord(li,time,stars,mistakes){if(!db)return;const tx=db.transaction('records','readwrite');const s=tx.objectStore('records');
  const r=s.get(li);r.onsuccess=()=>{const ex=r.result;if(!ex||time<ex.time||stars>ex.stars)s.put({li,time,stars,mistakes,date:Date.now()})}}
function getRecords(){if(!db)return Promise.resolve({});return new Promise(res=>{const tx=db.transaction('records','readonly');
  const r=tx.objectStore('records').getAll();r.onsuccess=()=>{const m={};r.result.forEach(r=>m[r.li]=r);res(m)};r.onerror=()=>res({})})}

// ===== 3D GAME LOOP =====
let rafId;

function initThreeJS() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  clock = new THREE.Clock();

  // Lighting
  const ambient = new THREE.AmbientLight(0x8899bb, 0.7);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 100;
  sun.shadow.camera.left = -15;
  sun.shadow.camera.right = 15;
  sun.shadow.camera.top = 15;
  sun.shadow.camera.bottom = -15;
  scene.add(sun);

  // Add hemisphere light for more natural look
  const hemi = new THREE.HemisphereLight(0x87CEEB, 0x7cb342, 0.3);
  scene.add(hemi);

  scene.background = new THREE.Color(0x87CEEB);

  const container = document.getElementById('game-container');
  container.appendChild(renderer.domElement);
}

function actualStartLevel(idx){
  showScreen('game-screen');

  if (!renderer) initThreeJS();

  // Reset scene
  while(scene.children.length > 0) {
    const child = scene.children[0];
    scene.remove(child);
  }
  // Re-add lights
  const ambient = new THREE.AmbientLight(0x8899bb, 0.7);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 100;
  sun.shadow.camera.left = -40;
  sun.shadow.camera.right = 40;
  sun.shadow.camera.top = 40;
  sun.shadow.camera.bottom = -40;
  scene.add(sun);
  const hemi = new THREE.HemisphereLight(0x87CEEB, 0x7cb342, 0.3);
  scene.add(hemi);

  function resize(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.removeEventListener('resize', resize);
  window.addEventListener('resize', resize);
  resize();

  game = new Game(idx);
  sceneObjects = sceneObjects.filter(o => o); // clean nulls
  // Reset engagement HUD
  document.getElementById('hud-coins').textContent='0';
  document.getElementById('hud-streak').style.display='none';
  document.getElementById('hud-boost').style.display='none';

  // Professor Zählix entrance taunt
  setTimeout(()=>{
    if(!game)return;
    const taunts=I18N[LANG]?.zahlix_taunt||I18N.en.zahlix_taunt;
    const taunt=taunts[Math.floor(Math.random()*taunts.length)];
    sfxZahlix();
    showFlash('🧙‍♂️ Prof. Zählix: "'+taunt+'"','#7B1FA2');
  },2000);

  if(rafId) cancelAnimationFrame(rafId);
  let mmCounter = 0;
  function loop(){
    if(!game)return;
    game.update();
    renderer.render(scene, camera);
    // Minimap every 10 frames
    if (mmCounter++ % 10 === 0) game.renderMinimap();
    rafId=requestAnimationFrame(loop);
  }
  loop();
}

function startLevel(idx){
  showLevelIntro(idx,()=>actualStartLevel(idx));
}

      }

});

// Camera orbit controls (desktop: right-click/middle-click drag + scroll, mobile: two-finger)
document.addEventListener('mousedown', e => {
  if ((e.button === 1 || e.button === 2) && game && !game.activeQuest) {
    cameraOrbitDrag = true;
    cameraOrbitLastX = e.clientX;
    e.preventDefault();
  }
});
document.addEventListener('mousemove', e => {
  if (cameraOrbitDrag) {
    const dx = e.clientX - cameraOrbitLastX;
    cameraAngle -= dx * 0.008;
    cameraOrbitLastX = e.clientX;
  }
});
document.addEventListener('mouseup', e => {
  if (e.button === 1 || e.button === 2) cameraOrbitDrag = false;
});
document.addEventListener('contextmenu', e => {
  if (game) e.preventDefault();
});
document.addEventListener('wheel', e => {
  if (!game) return;
  cameraDistance = Math.max(6, Math.min(20, cameraDistance + e.deltaY * 0.01));
  cameraHeight = cameraDistance * 0.85;
  e.preventDefault();
}, {passive: false});

// Mobile: two-finger rotate + pinch zoom
let touchOrbitState = null;
document.addEventListener('touchstart', e => {
  if (e.touches.length === 2 && game) {
    const t1 = e.touches[0], t2 = e.touches[1];
    const dx = t2.clientX - t1.clientX, dy = t2.clientY - t1.clientY;
    touchOrbitState = {
      angle: Math.atan2(dy, dx),
      dist: Math.sqrt(dx*dx + dy*dy),
      camAngle: cameraAngle,
      camDist: cameraDistance
    };
  }
}, {passive: true});
document.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && touchOrbitState && game) {
    const t1 = e.touches[0], t2 = e.touches[1];
    const dx = t2.clientX - t1.clientX, dy = t2.clientY - t1.clientY;
    const newAngle = Math.atan2(dy, dx);
    const newDist = Math.sqrt(dx*dx + dy*dy);
    cameraAngle = touchOrbitState.camAngle - (newAngle - touchOrbitState.angle);
    cameraDistance = Math.max(6, Math.min(20, touchOrbitState.camDist * (touchOrbitState.dist / Math.max(1, newDist))));
    cameraHeight = cameraDistance * 0.85;
  }
}, {passive: true});
document.addEventListener('touchend', e => {
  if (e.touches.length < 2) touchOrbitState = null;
}, {passive: true});

// Touch swipe on game container
document.addEventListener('DOMContentLoaded', () => {
  const gc = document.getElementById('game-container');
  if (!gc) return;
  let touchS=null;
  gc.addEventListener('touchstart',e=>{if(e.touches.length===1)touchS={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
  gc.addEventListener('touchend',e=>{if(!touchS||!game)return;
    const dx=e.changedTouches[0].clientX-touchS.x,dy=e.changedTouches[0].clientY-touchS.y;
    if(Math.sqrt(dx*dx+dy*dy)>30){const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');game.tryMove(dir)}
    touchS=null});
});
