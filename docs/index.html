function buildPlayer3D(charKey) {
  const ch = CHARS[charKey] || CHARS.ranger;
  const group = new THREE.Group();

  // Body (capsule)
  const bodyMat = new THREE.MeshStandardMaterial({color: ch.color, flatShading: true});
  const body = new THREE.Mesh(GEO.capsule, bodyMat);
  body.position.y = 0.32;
  body.castShadow = true;
  group.add(body);
  group.userData.body = body;

  // Pants
  const pantsMat = new THREE.MeshStandardMaterial({color: ch.pantsColor, flatShading: true});
  const pants = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.12, 0.12, 6), pantsMat);
  pants.position.y = 0.18;
  group.add(pants);

  // Head
  const head = new THREE.Mesh(GEO.head, MAT.skin);
  head.position.y = 0.6;
  head.castShadow = true;
  group.add(head);
  group.userData.head = head;

  // Hair
  const hairMat = new THREE.MeshStandardMaterial({color: ch.hairColor, flatShading: true});
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 4, 0, Math.PI*2, 0, Math.PI*0.65), hairMat);
  hair.position.y = 0.66;
  group.add(hair);

  // Eyes
  const eyeL = new THREE.Mesh(GEO.eye, MAT.dark);
  eyeL.position.set(-0.05, 0.6, 0.12);
  const eyeR = new THREE.Mesh(GEO.eye, MAT.dark);
  eyeR.position.set(0.05, 0.6, 0.12);
  group.add(eyeL, eyeR);

  // Eye whites
  const eyeWhiteMat = new THREE.MeshStandardMaterial({color:0xffffff,flatShading:true});
  const ewL = new THREE.Mesh(new THREE.SphereGeometry(0.032, 4, 3), eyeWhiteMat);
  ewL.position.set(-0.05, 0.6, 0.11);
  const ewR = new THREE.Mesh(new THREE.SphereGeometry(0.032, 4, 3), eyeWhiteMat);
  ewR.position.set(0.05, 0.6, 0.11);
  group.add(ewL, ewR);

  // Arms
  const armMat = new THREE.MeshStandardMaterial({color: ch.color, flatShading: true});
  const armL = new THREE.Mesh(GEO.arm, armMat);
  armL.position.set(-0.18, 0.35, 0);
  const armR = new THREE.Mesh(GEO.arm, armMat);
  armR.position.set(0.18, 0.35, 0);
  group.add(armL, armR);
  group.userData.armL = armL;
  group.userData.armR = armR;

  // Legs
  const legL = new THREE.Mesh(GEO.leg, pantsMat);
  legL.position.set(-0.06, 0.08, 0);
  const legR = new THREE.Mesh(GEO.leg, pantsMat);
  legR.position.set(0.06, 0.08, 0);
  group.add(legL, legR);
  group.userData.legL = legL;
  group.userData.legR = legR;

  // Shoes
  const shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.08), MAT.shoe);
  shoeL.position.set(-0.06, 0.02, 0.01);
  const shoeR = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.08), MAT.shoe);
  shoeR.position.set(0.06, 0.02, 0.01);
  group.add(shoeL, shoeR);
  group.userData.shoeL = shoeL;
  group.userData.shoeR = shoeR;

  // Accessory
  if (ch.accessory === 'backpack') {
    const bp = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 0.08), new THREE.MeshStandardMaterial({color:0x795548, flatShading:true}));
    bp.position.set(0, 0.35, -0.14);
    group.add(bp);
  } else if (ch.accessory === 'cap') {
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.06, 6), new THREE.MeshStandardMaterial({color:0xf44336, flatShading:true}));
    cap.position.y = 0.72;
    group.add(cap);
  } else if (ch.accessory === 'glasses') {
    const gMat = new THREE.MeshStandardMaterial({color:0x333333, flatShading:true});
    const gL = new THREE.Mesh(new THREE.TorusGeometry(0.04, 0.008, 4, 6), gMat);
    gL.position.set(-0.05, 0.6, 0.13);
    const gR = new THREE.Mesh(new THREE.TorusGeometry(0.04, 0.008, 4, 6), gMat);
    gR.position.set(0.05, 0.6, 0.13);
    const bridge = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.06, 3), gMat);
    bridge.rotation.z = Math.PI/2;
    bridge.position.set(0, 0.6, 0.14);
    group.add(gL, gR, bridge);
  }

  group.scale.set(0.9, 0.9, 0.9);
  return group;
}

function buildDog3D(dogKey) {
  const dog = DOGS[dogKey]; if (!dog) return new THREE.Group();
  const group = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({color: dog.bodyColor, flatShading: true});
  const bellyMat = new THREE.MeshStandardMaterial({color: dog.bellyColor, flatShading: true});
  const earMat = new THREE.MeshStandardMaterial({color: dog.earColor, flatShading: true});

  // Body (horizontal capsule)
  const body = new THREE.Mesh(GEO.dogBody, bodyMat);
  body.rotation.z = Math.PI / 2;
  body.position.y = 0.17;
  body.castShadow = true;
  group.add(body);

  // Head
  const head = new THREE.Mesh(GEO.dogHead, bodyMat);
  head.position.set(0, 0.25, 0.18);
  group.add(head);
  group.userData.head = head;

  // Nose
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.025, 4, 3), MAT.dark);
  nose.position.set(0, 0.24, 0.28);
  group.add(nose);

  // Eyes
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.018, 4, 3), MAT.dark);
  eyeL.position.set(-0.04, 0.28, 0.25);
  const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.018, 4, 3), MAT.dark);
  eyeR.position.set(0.04, 0.28, 0.25);
  group.add(eyeL, eyeR);

  // Ears
  if (dog.earStyle === 'floppy') {
    const earGeo = new THREE.SphereGeometry(0.04, 4, 3);
    const eL = new THREE.Mesh(earGeo, earMat);
    eL.position.set(-0.08, 0.28, 0.14);
    eL.scale.set(1, 1.5, 0.7);
    const eR = new THREE.Mesh(earGeo, earMat);
    eR.position.set(0.08, 0.28, 0.14);
    eR.scale.set(1, 1.5, 0.7);
    group.add(eL, eR);
  } else {
    // Pointy ears
    const earGeo = new THREE.ConeGeometry(0.03, 0.06, 4);
    const eL = new THREE.Mesh(earGeo, earMat);
    eL.position.set(-0.06, 0.34, 0.15);
    const eR = new THREE.Mesh(earGeo, earMat);
    eR.position.set(0.06, 0.34, 0.15);
    group.add(eL, eR);
  }

  // Legs (4)
  const legPositions = [[-0.06, 0.05, 0.08], [0.06, 0.05, 0.08], [-0.06, 0.05, -0.08], [0.06, 0.05, -0.08]];
  const legs = [];
  legPositions.forEach(p => {
    const leg = new THREE.Mesh(GEO.dogLeg, bodyMat);
    leg.position.set(...p);
    group.add(leg);
    legs.push(leg);
  });
  group.userData.legs = legs;

  // Tail
  const tail = new THREE.Mesh(GEO.dogTail, bodyMat);
  tail.position.set(0, 0.22, -0.18);
  tail.rotation.x = -0.5;
  group.add(tail);
  group.userData.tail = tail;

  // Spots for dalmatian
  if (dog.spotColor) {
    const spotMat = new THREE.MeshStandardMaterial({color: dog.spotColor, flatShading: true});
    const spots = [[0.08,0.2,0.05],[-0.06,0.18,-0.04],[0.03,0.22,0.1]];
    spots.forEach(sp => {
      const spot = new THREE.Mesh(new THREE.SphereGeometry(0.025, 4, 3), spotMat);
      spot.position.set(sp[0]||0, sp[1]||0.2, sp[2]||0);
      group.add(spot);
    });
  }

  group.scale.set(0.7, 0.7, 0.7);
  return group;
}

function buildNPC3D(tileType) {
  const group = new THREE.Group();
  const npcConfigs = {
    [T.NPC_BUT]: {color:0xffeb3b, bodyColor:0x8bc34a, hasWings:true},
    [T.NPC_SQU]: {color:0x8d6e63, bodyColor:0xa1887f, hasTail:true},
    [T.NPC_BEAR]: {color:0x5d4037, bodyColor:0x795548, big:true},
    [T.NPC_BIRD]: {color:0x42a5f5, bodyColor:0x64b5f6, hasWings:true, small:true},
  };
  const cfg = npcConfigs[tileType] || npcConfigs[T.NPC_BUT];
  const bodyMat = new THREE.MeshStandardMaterial({color: cfg.bodyColor, flatShading: true});
  const scale = cfg.big ? 1.2 : cfg.small ? 0.6 : 0.8;

  // Body
  const body = new THREE.Mesh(GEO.capsule, bodyMat);
  body.position.y = 0.3;
  body.castShadow = true;
  group.add(body);

  // Head
  const headMat = new THREE.MeshStandardMaterial({color: cfg.color, flatShading: true});
  const head = new THREE.Mesh(GEO.head, headMat);
  head.position.y = 0.55;
  group.add(head);

  // Eyes
  const eyeL = new THREE.Mesh(GEO.eye, MAT.dark);
  eyeL.position.set(-0.04, 0.55, 0.12);
  const eyeR = new THREE.Mesh(GEO.eye, MAT.dark);
  eyeR.position.set(0.04, 0.55, 0.12);
  group.add(eyeL, eyeR);

  // Wings (butterfly/bird)
  if (cfg.hasWings) {
    const wingMat = new THREE.MeshStandardMaterial({
      color: tileType === T.NPC_BUT ? 0xff9800 : 0x90caf9,
      flatShading: true, transparent: true, opacity: 0.8, side: THREE.DoubleSide
    });
    const wingGeo = new THREE.PlaneGeometry(0.25, 0.2);
    const wingL = new THREE.Mesh(wingGeo, wingMat);
    wingL.position.set(-0.2, 0.4, 0);
    wingL.rotation.y = 0.3;
    const wingR = new THREE.Mesh(wingGeo, wingMat);
    wingR.position.set(0.2, 0.4, 0);
    wingR.rotation.y = -0.3;
    group.add(wingL, wingR);
    group.userData.wingL = wingL;
    group.userData.wingR = wingR;
  }

  // Bushy tail (squirrel)
  if (cfg.hasTail) {
    const tailMat = new THREE.MeshStandardMaterial({color: cfg.bodyColor, flatShading: true});
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.25, 5), tailMat);
    tail.position.set(0, 0.35, -0.15);
    tail.rotation.x = 0.5;
    group.add(tail);
    group.userData.tail = tail;
  }

  // Bird beak
  if (tileType === T.NPC_BIRD) {
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.06, 4), new THREE.MeshStandardMaterial({color:0xff9800, flatShading:true}));
    beak.position.set(0, 0.53, 0.15);
    beak.rotation.x = Math.PI/2;
    group.add(beak);
  }

  group.scale.set(scale, scale, scale);
  return group;
}

function buildGate3D(isOpen = false) {
  const group = new THREE.Group();
  // Left pillar
  const pL = new THREE.Mesh(GEO.gatePost, MAT.gate);
  pL.position.set(-0.35, 0.4, 0);
  // Right pillar
  const pR = new THREE.Mesh(GEO.gatePost, MAT.gate);
  pR.position.set(0.35, 0.4, 0);
  // Top bar
  const bar = new THREE.Mesh(GEO.gateBar, MAT.gate);
  bar.position.set(0, 0.75, 0);
  group.add(pL, pR, bar);
  group.userData.bar = bar;
  group.userData.pL = pL;
  group.userData.pR = pR;

  // Warm glow
  const light = new THREE.PointLight(0xffaa33, 0.8, 3);
  light.position.set(0, 0.9, 0);
  group.add(light);
  group.userData.light = light;

  if (isOpen) {
    bar.rotation.x = -Math.PI / 2;
    bar.position.y = 1.0;
  }
  return group;
}

function buildDogGate3D() {
  const group = new THREE.Group();
  const pL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), MAT.dogGate);
  pL.position.set(-0.3, 0.3, 0);
  const pR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), MAT.dogGate);
  pR.position.set(0.3, 0.3, 0);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.05), MAT.dogGate);
  bar.position.set(0, 0.55, 0);
  group.add(pL, pR, bar);
  group.userData.bar = bar;
  return group;
}

// ===== SIMPLE 2D THUMBNAIL DRAWING (for menus) =====
function drawPlayerThumb(ctx, charKey, w, h) {
  const ch = CHARS[charKey] || CHARS.ranger;
  ctx.clearRect(0, 0, w, h);
  // Body
  ctx.fillStyle = ch.color;
  ctx.beginPath(); ctx.arc(w/2, h*0.55, w*0.22, 0, Math.PI*2); ctx.fill();
  // Head
  ctx.fillStyle = '#FDBCB4';
  ctx.beginPath(); ctx.arc(w/2, h*0.32, w*0.18, 0, Math.PI*2); ctx.fill();
  // Hair
  ctx.fillStyle = ch.hairColor;
  ctx.beginPath(); ctx.arc(w/2, h*0.26, w*0.19, Math.PI, 0); ctx.fill();
  // Eyes
  ctx.fillStyle = '#333';
  ctx.fillRect(w/2-6, h*0.30, 3, 4);
  ctx.fillRect(w/2+3, h*0.30, 3, 4);
  // Smile
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(w/2, h*0.36, w*0.06, 0.2, Math.PI-0.2); ctx.stroke();
  // Legs
  ctx.fillStyle = ch.pantsColor;
  ctx.fillRect(w/2-8, h*0.68, 6, h*0.2);
  ctx.fillRect(w/2+2, h*0.68, 6, h*0.2);
  // Shoes
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(w/2-9, h*0.85, 8, 5);
  ctx.fillRect(w/2+1, h*0.85, 8, 5);
}

function drawDogThumb(ctx, dogKey, w, h) {
  const dog = DOGS[dogKey]; if (!dog) return;
  ctx.clearRect(0, 0, w, h);
  // Body
  ctx.fillStyle = dog.bodyColor;
  ctx.beginPath(); ctx.ellipse(w/2, h*0.55, w*0.28, h*0.18, 0, 0, Math.PI*2); ctx.fill();
  // Head
  ctx.beginPath(); ctx.arc(w/2, h*0.35, w*0.16, 0, Math.PI*2); ctx.fill();
  // Ears
  ctx.fillStyle = dog.earColor;
  if (dog.earStyle === 'floppy') {
    ctx.beginPath(); ctx.ellipse(w/2-w*0.14, h*0.38, w*0.06, h*0.08, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w/2+w*0.14, h*0.38, w*0.06, h*0.08, 0, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(w/2-10, h*0.28); ctx.lineTo(w/2-14, h*0.18); ctx.lineTo(w/2-4, h*0.25); ctx.fill();
    ctx.beginPath(); ctx.moveTo(w/2+10, h*0.28); ctx.lineTo(w/2+14, h*0.18); ctx.lineTo(w/2+4, h*0.25); ctx.fill();
  }
  // Eyes & nose
  ctx.fillStyle = '#333';
  ctx.fillRect(w/2-5, h*0.32, 3, 3);
  ctx.fillRect(w/2+2, h*0.32, 3, 3);
  ctx.fillRect(w/2-2, h*0.38, 4, 3);
  // Legs
  ctx.fillStyle = dog.bodyColor;
  for (const lx of [-10,-3,4,11]) ctx.fillRect(w/2+lx, h*0.68, 5, h*0.15);
  // Tail
  ctx.strokeStyle = dog.bodyColor; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(w/2+w*0.25, h*0.5); ctx.quadraticCurveTo(w/2+w*0.35, h*0.35, w/2+w*0.3, h*0.28); ctx.stroke();
}


// ===== GAME STATE =====
let game=null,playerChar='ranger',playerName='Ada';
let globalFC=0,animF=0;

class Game{
  constructor(li){
    this.ld=LEVELS[li];this.li=li;
    this.map=this.ld.map.map(r=>[...r]);this.mh=this.map.length;this.mw=this.map[0].length;
    this.p={x:this.ld.start.x,y:this.ld.start.y,dir:'down',frame:0,moving:false,
      tx:this.ld.start.x,ty:this.ld.start.y,px:this.ld.start.x,py:this.ld.start.y,
      idleT:0,bobDir:1};
    this.dogs=this.ld.dogs.map(d=>({...d,rescued:false,followX:0,followY:0}));
    this.rescued=[];
    this.gates=this.ld.gates.map(g=>({...g,open:false,quests:null,openAnim:0}));
    this.npcs=this.ld.npcs.map(n=>({...n,bobT:Math.random()*100}));
    this.startTime=Date.now();this.mistakes=0;this.totalDogs=this.dogs.length;
    this.fc=0;this.particles=[];this.showBubble=null;
    this.activeQuest=null;this.questIdx=0;this.questList=null;
    this.moveDir=null;this.moveHeld=false;this.moveCD=0;
    this.gateOpenEffect=null;

    // Build 3D scene
    buildLevel3D(this.ld);
    this.build3DEntities();

    // Position camera
    this.updateCam(true);
  }

  build3DEntities() {
    // Player mesh
    playerGroup = buildPlayer3D(playerChar);
    playerGroup.position.set(this.p.x + 0.5, 0, this.p.y + 0.5);
    scene.add(playerGroup);
    sceneObjects.push(playerGroup);
    playerMesh = playerGroup;

    // Gates
    this.gates.forEach((g, gi) => {
      if (!g.open && this.map[g.y] && this.map[g.y][g.x] === T.GATE) {
        const gm = buildGate3D(false);
        gm.position.set(g.x + 0.5, 0, g.y + 0.5);
        scene.add(gm);
        sceneObjects.push(gm);
        gateMeshes[gi] = gm;
      }
    });

    // Dog cage gates
    this.dogs.forEach((dog, di) => {
      if (dog.cageGate) {
        const dg = buildDogGate3D();
        dg.position.set(dog.cageGate.x + 0.5, 0, dog.cageGate.y + 0.5);
        scene.add(dg);
        sceneObjects.push(dg);
        gateMeshes['dog_' + di] = dg;
      }
    });

    // Unrescued dogs
    this.dogs.forEach((dog, di) => {
      const dm = buildDog3D(dog.key);
      dm.position.set(dog.x + 0.5, 0, dog.y + 0.5);
      scene.add(dm);
      sceneObjects.push(dm);
      dogMeshes[di] = dm;
    });

    // NPCs
    this.npcs.forEach((npc, ni) => {
      const nm = buildNPC3D(npc.type);
      nm.position.set(npc.x + 0.5, 0, npc.y + 0.5);
      scene.add(nm);
      sceneObjects.push(nm);
      npcMeshes[ni] = nm;
    });
  }

  updateCam(instant=false){
    const tx = this.p.px + 0.5;
    const tz = this.p.py + 0.5;
    const targetPos = new THREE.Vector3(tx, 0.5, tz);
    const desiredCam = new THREE.Vector3(tx, 8, tz + 6);

    if (instant) {
      camera.position.copy(desiredCam);
    } else {
      camera.position.lerp(desiredCam, 0.08);
    }
    camera.lookAt(targetPos);
  }

  tryMove(dir){
    if(this.p.moving||this.activeQuest)return;
    const dx=dir==='left'?-1:dir==='right'?1:0,dy=dir==='up'?-1:dir==='down'?1:0;
    this.p.dir=dir;
    const nx=this.p.x+dx,ny=this.p.y+dy;
    if(nx<0||ny<0||nx>=this.mw||ny>=this.mh)return;
    const tile=this.map[ny][nx];

    if(tile===T.GATE){
      const g=this.gates.find(g=>g.x===nx&&g.y===ny);
      if(g&&!g.open){this.openGateQuest(g);return}
      if(g&&g.open){this.doMove(nx,ny);return}
      return;
    }

    if(tile===T.DOG_GATE){
      const nearDog=this.dogs.find(d=>!d.rescued&&d.cageGate&&d.cageGate.x===nx&&d.cageGate.y===ny);
      if(nearDog&&!nearDog.cageOpen){
        if(!nearDog.quests)nearDog.quests=genQuests(3,this.ld.diff);
        showFlash('🐕 '+getCageMessage(),'#FF9800');
        this.activeQuest={type:'dogCage',dog:nearDog,x:nx,y:ny};
        this.questList=nearDog.quests;this.questIdx=0;
        this.addBurst(nx+0.5,0.5,ny+0.5,8,'#FF9800');
        showQuestUI(this.questList,0,nearDog.quests.length);
        return;
      }
      if(nearDog&&nearDog.cageOpen){this.doMove(nx,ny);return}
      this.doMove(nx,ny);return;
    }

    if(tile===T.DOG){
      const dog=this.dogs.find(d=>d.x===nx&&d.y===ny&&!d.rescued);
      if(dog){
        dog.rescued=true;dog.rescueAnim=40;
        dog.followX=this.p.px;dog.followY=this.p.py;
        this.rescued.push(dog);
        this.map[ny][nx]=T.GRASS;
        sfxRescue();
        this.addBurst(nx+0.5,0.5,ny+0.5,25,'#FFD700');
        // Hide the dog mesh, create following version
        const di = this.dogs.indexOf(dog);
        if (dogMeshes[di]) { dogMeshes[di].visible = false; }
        const followDog = buildDog3D(dog.key);
        followDog.position.set(this.p.px + 0.5, 0, this.p.py + 0.5);
        scene.add(followDog);
        sceneObjects.push(followDog);
        rescuedDogMeshes.push({mesh: followDog, dog: dog});
        showFlash('🐕 '+dog.name+': "'+getDogRescueMessage()+'"','#4CAF50');
        this.doMove(nx,ny);
        return;
      }
      this.map[ny][nx]=T.GRASS;
    }

    if(INTERACT.has(tile)){this.interactWith(nx,ny,tile);return}
    if(!WALKABLE.has(tile))return;

    if(tile===T.EXIT){
      if(this.rescued.length>=this.totalDogs){this.complete();return}
      else{const rem=this.totalDogs-this.rescued.length;showFlash(t('find_dogs',rem),'#FF9800');return}
    }

    this.doMove(nx,ny);
  }

  doMove(nx,ny){
    this.p.tx=nx;this.p.ty=ny;this.p.moving=true;this.p.frame++;
    this.p.idleT=0;sfxStep();
  }

  interactWith(x,y,tile){
    const npc=this.npcs.find(n=>n.x===x&&n.y===y);
    if(!npc)return;
    sfxBubble();
    const npcIdx=this.npcs.indexOf(npc);
    const storyNpc=getLevelNPC(this.li,npcIdx);
    let name,portrait,text;
    if(storyNpc){
      const charData=STORY.npcs[storyNpc.char];
      portrait=charData?charData.portrait:'❓';
      name=(charData?charData.name[LANG]||charData.name.en:storyNpc.char);
      const key=this.li+'_'+npcIdx;
      if(!storyState.npcTalkCount[key])storyState.npcTalkCount[key]=0;
      const lineIdx=storyState.npcTalkCount[key]%storyNpc.lines.length;
      text=storyNpc.lines[lineIdx];
      storyState.npcTalkCount[key]++;
    } else {
      const fallbackNames={[T.NPC_BUT]:'Butterfly',[T.NPC_SQU]:'Squirrel',[T.NPC_BEAR]:'Bear',[T.NPC_BIRD]:'Bird'};
      const fallbackPortraits={[T.NPC_BUT]:'🦋',[T.NPC_SQU]:'🐿️',[T.NPC_BEAR]:'🐻',[T.NPC_BIRD]:'🐦'};
      name=fallbackNames[tile]||'???';portrait=fallbackPortraits[tile]||'❓';
      text=t(Math.random()>0.4?'npc_hint':'npc_hello');
    }
    // Project 3D position to screen
    const screen = worldToScreen(x + 0.5, y + 0.5);
    showSpeechBubble(portrait+' '+name,text,screen.x,screen.y);
  }

  openGateQuest(gate){
    if(!gate.quests)gate.quests=genQuests(gate.qc,gate.d);
    this.activeQuest=gate;this.questList=gate.quests;this.questIdx=0;
    this.addBurst(gate.x+0.5,0.5,gate.y+0.5,8,'#FFD700');
    showQuestUI(this.questList,0,gate.qc);
  }

  questAnswered(correct){
    if(!correct){this.mistakes++;return false}
    this.questIdx++;
    if(this.questList){
      const pct=Math.round((this.questIdx/this.questList.length)*100);
      document.getElementById('quest-bar').style.width=pct+'%';
    }
    if(this.questIdx>=this.questList.length){
      if(this.activeQuest.type==='dogCage'){
        const dog=this.activeQuest.dog;
        const gx=this.activeQuest.x,gy=this.activeQuest.y;
        dog.cageOpen=true;
        this.map[gy][gx]=T.GRASS;
        // Remove fences around dog
        for(let fdy=-1;fdy<=1;fdy++)for(let fdx=-1;fdx<=1;fdx++){
          const fy2=dog.y+fdy,fx2=dog.x+fdx;
          if(fy2>=0&&fy2<this.mh&&fx2>=0&&fx2<this.mw&&this.map[fy2][fx2]===T.FENCE){
            this.map[fy2][fx2]=T.GRASS;
          }
        }
        // Remove dog gate mesh
        const di = this.dogs.indexOf(dog);
        const dgMesh = gateMeshes['dog_' + di];
        if (dgMesh) { scene.remove(dgMesh); dgMesh.visible = false; }
        // Rebuild fences (remove all fence instances and rebuild)
        this.rebuildFences();
        this.activeQuest=null;this.questList=null;
        sfxGateOpen();hideQuestUI();
        this.addBurst(gx+0.5,0.5,gy+0.5,25,'#FF9800');
        this.addBurst(dog.x+0.5,0.5,dog.y+0.5,20,'#FFD700');
        showFlash('🔓 '+dog.name+': "'+getDogRescueMessage()+'"','#FF9800');
        return true;
      }
      // Gate solved
      const gx=this.activeQuest.x,gy=this.activeQuest.y;
      this.activeQuest.open=true;
      this.activeQuest.openAnim=30;
      this.map[gy][gx]=T.PATH;
      // Animate gate opening
      const gi = this.gates.indexOf(this.activeQuest);
      const gMesh = gateMeshes[gi];
      if (gMesh) {
        gMesh.userData._opening = true;
        gMesh.userData._openProgress = 0;
      }
      this.activeQuest=null;this.questList=null;
      sfxGateOpen();hideQuestUI();
      this.addBurst(gx+0.5,0.8,gy+0.5,30,'#FFD700');
      showFlash('✨ Gate opened! ✨','#4CAF50');
      return true;
    }
    showQuestUI(this.questList,this.questIdx,this.questList.length);return true;
  }

  rebuildFences() {
    // Remove existing fence instanced meshes and rebuild
    sceneObjects = sceneObjects.filter(o => {
      if (o.geometry === GEO.fence && o.isInstancedMesh) {
        scene.remove(o);
        return false;
      }
      return true;
    });
    // Count remaining fences
    let fCount = 0;
    for (let r = 0; r < this.mh; r++) for (let c = 0; c < this.mw; c++) {
      if (this.map[r][c] === T.FENCE) fCount++;
    }
    if (fCount > 0) {
      const fIM = new THREE.InstancedMesh(GEO.fence, MAT.fence, fCount);
      fIM.castShadow = true;
      let fi = 0;
      const m4 = new THREE.Matrix4();
      for (let r = 0; r < this.mh; r++) for (let c = 0; c < this.mw; c++) {
        if (this.map[r][c] === T.FENCE) {
          m4.makeTranslation(c + 0.5, 0.2, r + 0.5);
          fIM.setMatrixAt(fi++, m4);
        }
      }
      fIM.instanceMatrix.needsUpdate = true;
      scene.add(fIM);
      sceneObjects.push(fIM);
    }
  }

  update(){
    this.fc++;globalFC=this.fc;animF=Math.floor(this.fc/15);
    const spd = 0.35;

    // Player movement (lerp toward target tile)
    if(this.p.moving){
      const tx=this.p.tx,ty=this.p.ty;
      const dx=tx-this.p.px,dy=ty-this.p.py,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<spd){this.p.px=tx;this.p.py=ty;this.p.x=this.p.tx;this.p.y=this.p.ty;this.p.moving=false}
      else{this.p.px+=(dx/dist)*spd;this.p.py+=(dy/dist)*spd}
    }else{
      this.p.idleT++;
    }
    if(!this.p.moving&&this.moveHeld&&this.moveDir){this.moveCD--;if(this.moveCD<=0){this.tryMove(this.moveDir);this.moveCD=2}}

    // Auto-trigger quest when adjacent to gate/cage
    if(!this.p.moving&&!this.activeQuest){
      const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
      for(const[ddx,ddy] of dirs){
        const ax=this.p.x+ddx,ay=this.p.y+ddy;
        if(ax<0||ay<0||ax>=this.mw||ay>=this.mh)continue;
        const t2=this.map[ay][ax];
        if(t2===T.GATE){
          const g=this.gates.find(g2=>g2.x===ax&&g2.y===ay&&!g2.open);
          if(g&&!g.autoTriggered){g.autoTriggered=true;this.openGateQuest(g);break}
        }
        if(t2===T.DOG_GATE){
          const nd=this.dogs.find(d=>!d.rescued&&d.cageGate&&d.cageGate.x===ax&&d.cageGate.y===ay&&!d.cageOpen);
          if(nd&&!nd.autoTriggered){
            nd.autoTriggered=true;
            if(!nd.quests)nd.quests=genQuests(3,this.ld.diff);
            showFlash('🐕 '+getCageMessage(),'#FF9800');
            this.activeQuest={type:'dogCage',dog:nd,x:ax,y:ay};
            this.questList=nd.quests;this.questIdx=0;
            this.addBurst(ax+0.5,0.5,ay+0.5,8,'#FF9800');
            showQuestUI(this.questList,0,nd.quests.length);break;
          }
        }
      }
    }

    // Dog following
    let prevX=this.p.px,prevY=this.p.py;
    for(const dog of this.rescued){
      const tdx=prevX-dog.followX,tdy=prevY-dog.followY;
      const dd=Math.sqrt(tdx*tdx+tdy*tdy);
      if(dd>1.2){dog.followX+=tdx*0.08;dog.followY+=tdy*0.08}
      prevX=dog.followX;prevY=dog.followY;
      if(dog.rescueAnim>0)dog.rescueAnim--;
    }

    // 3D Particles
    this.particles=this.particles.filter(p=>{
      p.life--;
      p.mesh.position.x+=p.vx;
      p.mesh.position.y+=p.vy;
      p.mesh.position.z+=p.vz;
      p.vy-=0.005;
      const s=Math.max(0.01, p.life/p.maxLife);
      p.mesh.scale.set(s,s,s);
      if(p.life<=0){scene.remove(p.mesh);return false}
      return true;
    });

    // Gate open animations
    Object.values(gateMeshes).forEach(gm => {
      if (gm.userData._opening && gm.userData._openProgress < 1) {
        gm.userData._openProgress += 0.03;
        const bar = gm.userData.bar;
        if (bar) {
          bar.rotation.x = -gm.userData._openProgress * Math.PI / 2;
          bar.position.y = 0.75 + gm.userData._openProgress * 0.25;
        }
        if (gm.userData._openProgress >= 1) {
          gm.userData._opening = false;
        }
      }
    });

    // NPC bobbing & wing flapping
    this.npcs.forEach((n, ni) => {
      n.bobT += 0.03;
      const nm = npcMeshes[ni];
      if (nm) {
        nm.position.y = Math.sin(n.bobT) * 0.05;
        if (nm.userData.wingL) {
          nm.userData.wingL.rotation.y = 0.3 + Math.sin(this.fc * 0.15) * 0.5;
          nm.userData.wingR.rotation.y = -0.3 - Math.sin(this.fc * 0.15) * 0.5;
        }
        if (nm.userData.tail) {
          nm.userData.tail.rotation.y = Math.sin(this.fc * 0.1) * 0.3;
        }
      }
    });

    // Unrescued dog animations (bounce exclamation in 3D = bob)
    this.dogs.forEach((dog, di) => {
      if (!dog.rescued && dogMeshes[di]) {
        const dm = dogMeshes[di];
        dm.position.y = Math.sin(this.fc * 0.04) * 0.05;
        if (dm.userData.tail) {
          dm.userData.tail.rotation.y = Math.sin(this.fc * 0.15) * 0.5;
        }
      }
    });

    // Gates open anim countdown (2D effects)
    this.gates.forEach(g=>{if(g.openAnim>0)g.openAnim--});

    // ===== UPDATE 3D OBJECTS =====

    // Player position & animation
    if (playerGroup) {
      const targetX = this.p.px + 0.5;
      const targetZ = this.p.py + 0.5;
      playerGroup.position.x = targetX;
      playerGroup.position.z = targetZ;

      // Face direction
      const dirAngles = {down: 0, left: Math.PI/2, up: Math.PI, right: -Math.PI/2};
      const targetAngle = dirAngles[this.p.dir] || 0;
      // Smooth rotation
      let diff = targetAngle - playerGroup.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      playerGroup.rotation.y += diff * 0.2;

      // Walk animation
      if (this.p.moving) {
        const walk = Math.sin(this.fc * 0.25) * 0.35;
        playerGroup.position.y = Math.abs(Math.sin(this.fc * 0.25)) * 0.03;
        if (playerGroup.userData.armL) playerGroup.userData.armL.rotation.x = walk;
        if (playerGroup.userData.armR) playerGroup.userData.armR.rotation.x = -walk;
        if (playerGroup.userData.legL) playerGroup.userData.legL.rotation.x = -walk * 0.6;
        if (playerGroup.userData.legR) playerGroup.userData.legR.rotation.x = walk * 0.6;
      } else {
        // Idle bob
        playerGroup.position.y = Math.sin(this.fc * 0.04) * 0.01;
        if (playerGroup.userData.armL) playerGroup.userData.armL.rotation.x *= 0.9;
        if (playerGroup.userData.armR) playerGroup.userData.armR.rotation.x *= 0.9;
        if (playerGroup.userData.legL) playerGroup.userData.legL.rotation.x *= 0.9;
        if (playerGroup.userData.legR) playerGroup.userData.legR.rotation.x *= 0.9;
      }
    }

    // Rescued dogs following
    rescuedDogMeshes.forEach((rd, i) => {
      const dog = rd.dog;
      const mesh = rd.mesh;
      mesh.position.x = dog.followX + 0.5;
      mesh.position.z = dog.followY + 0.5;
      let bounce = 0;
      if (dog.rescueAnim && dog.rescueAnim > 0) {
        bounce = Math.sin(dog.rescueAnim * 0.3) * 0.15 * (dog.rescueAnim / 40);
      }
      mesh.position.y = bounce + Math.sin(this.fc * 0.04 + i) * 0.02;
      // Tail wag
      if (mesh.userData.tail) {
        mesh.userData.tail.rotation.y = Math.sin(this.fc * 0.2 + i) * 0.5;
      }
      // Face toward player
      const dx2 = (this.p.px + 0.5) - mesh.position.x;
      const dz2 = (this.p.py + 0.5) - mesh.position.z;
      if (Math.abs(dx2) + Math.abs(dz2) > 0.1) {
        mesh.rotation.y = Math.atan2(dx2, dz2);
      }
    });

    // Water animation
    const time = this.fc * 0.02;
    waterMeshes.forEach(wm => {
      const pos = wm.geometry.attributes.position;
      if (!wm.userData._origY) {
        wm.userData._origY = Float32Array.from(pos.array);
      }
      const orig = wm.userData._origY;
      for (let i = 0; i < pos.count; i++) {
        // Y is the 3rd component (index 2) since plane is rotated
        // Actually for a PlaneGeometry, y is at array[i*3+2] before rotation
        // But we rotate the mesh, so we animate the local y (which becomes world y after rotation)
        // Local PlaneGeometry: x, y in plane, z = 0. After rotation x = -PI/2, local z becomes world y.
        const x = orig[i*3], y2 = orig[i*3+1];
        pos.array[i*3+2] = Math.sin(time + x * 3 + y2 * 2 + wm.userData.col) * 0.02;
      }
      pos.needsUpdate = true;
    });

    // Exit platform glow
    if (exitMesh) {
      exitMesh.rotation.y = this.fc * 0.01;
      exitMesh.position.y = 0.04 + Math.sin(this.fc * 0.05) * 0.02;
    }

    // HUD
    const el=Math.floor((Date.now()-this.startTime)/1000);
    document.getElementById('hud-timer').textContent=Math.floor(el/60)+':'+(el%60).toString().padStart(2,'0');
    document.getElementById('hud-dogs').textContent=this.rescued.length+'/'+this.totalDogs;

    this.updateCam();
  }

  addBurst(x, y, z, n, color) {
    const c = new THREE.Color(color);
    for (let i = 0; i < Math.min(n, 20); i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.02 + Math.random() * 0.05;
      const pMat = new THREE.MeshBasicMaterial({color: c});
      const pMesh = new THREE.Mesh(GEO.particle, pMat);
      pMesh.position.set(x, y, z);
      scene.add(pMesh);
      this.particles.push({
        mesh: pMesh,
        vx: Math.cos(angle) * speed,
        vy: 0.02 + Math.random() * 0.03,
        vz: Math.sin(angle) * speed,
        life: 25 + Math.random() * 25,
        maxLife: 50
      });
    }
  }

  renderMinimap() {
    const mc = document.getElementById('minimap-canvas');
    if (!mc) return;
    const mmS = Math.min(160 / this.mw, 120 / this.mh, 2);
    mc.width = Math.round(this.mw * mmS);
    mc.height = Math.round(this.mh * mmS);
    const mx = mc.getContext('2d');
    mx.fillStyle = '#000';
    mx.fillRect(0, 0, mc.width, mc.height);
    for (let r = 0; r < this.mh; r++) for (let c = 0; c < this.mw; c++) {
      const tile = this.map[r][c];
      const rgb = TILE_COLORS[tile] || [0x7c, 0xb3, 0x42];
      mx.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
      mx.fillRect(c * mmS, r * mmS, mmS, mmS);
    }
    // Player
    mx.fillStyle = '#ff0000';
    mx.fillRect(this.p.x * mmS - 1, this.p.y * mmS - 1, mmS + 2, mmS + 2);
    // Rescued dogs
    this.rescued.forEach(d => {
      mx.fillStyle = '#ff69b4';
      mx.fillRect(Math.round(d.followX) * mmS, Math.round(d.followY) * mmS, mmS, mmS);
    });
  }

  complete(){
    const el=Math.floor((Date.now()-this.startTime)/1000);
    const stars=this.mistakes===0?3:this.mistakes<=2?2:1;
    saveRecord(this.li,el,stars,this.mistakes);
    const li=this.li,rescued=this.rescued,mistakes=this.mistakes;
    showLevelOutro(li,()=>showVictory(rescued,el,mistakes,stars,li));
  }
}

function worldToScreen(wx, wz) {
  const vec = new THREE.Vector3(wx, 1.5, wz);
  vec.project(camera);
  return {
    x: (vec.x * 0.5 + 0.5) * window.innerWidth,
    y: (-vec.y * 0.5 + 0.5) * window.innerHeight
  };
}

  if(!ov||!body||!quests||!quests[idx]){console.error('showQuestUI: missing data',{ov:!!ov,body:!!body,quests:quests?.length,idx});return}

  ov.style.display='flex'; // force display in case CSS class fails
  ov.classList.add('active');body.innerHTML='';

  if(idx>0){

function renderPattern(body,q){
  const title=document.createElement('p');
  title.style.cssText='font-weight:700;font-size:1rem;margin-bottom:12px;color:#333';
  title.textContent=t('pattern_title');body.appendChild(title);
  const ser=document.createElement('div');ser.className='pattern-series';
  let cur=0;
  function draw(){ser.innerHTML='';q.series.forEach((item,i)=>{
    const row=document.createElement('div');
    row.className='pattern-row'+(i===cur?' current':'')+(i<cur?' solved':'');
    const eq=document.createElement('span');eq.className='pattern-eq';eq.textContent=item.eq;row.appendChild(eq);
    if(i<cur){const a=document.createElement('span');a.className='pattern-answer pattern-eq';a.textContent=item.ans;a.style.color='#2e7d32';row.appendChild(a)}
    else if(i===cur){
      const inp=document.createElement('input');inp.type='number';inp.className='pattern-input';inp.inputMode='numeric';row.appendChild(inp);
      const btn=document.createElement('button');btn.className='num-submit';btn.textContent=t('submit');
      btn.onclick=()=>check(inp,item);inp.addEventListener('keydown',e=>{if(e.key==='Enter')check(inp,item)});
      row.appendChild(btn);setTimeout(()=>inp.focus(),150)}
    ser.appendChild(row)});}
  function check(inp,item){
    if(parseInt(inp.value)===item.ans){sfxCorrect();cur++;
      if(cur>=q.series.length){draw();setTimeout(()=>{if(game)game.questAnswered(true)},600)}else draw()
    }else{sfxWrong();if(game)game.mistakes++;
      inp.style.borderColor='#f44336';inp.style.background='#ffebee';inp.style.animation='shake 0.3s';
      setTimeout(()=>{inp.style.borderColor='#4CAF50';inp.style.background='';inp.style.animation='';inp.value='';inp.focus()},500)}}
  body.appendChild(ser);draw();
}

function renderChoice(body,q){
  const eq=document.createElement('p');
  eq.style.cssText="font-size:1.3rem;font-weight:700;text-align:center;margin:10px 0 16px;font-family:'Courier New',monospace";
  eq.textContent=q.eq+' = ?';body.appendChild(eq);
  const grid=document.createElement('div');grid.className='mc-grid';
  let att=0;
  q.choices.forEach(c=>{const btn=document.createElement('button');btn.className='mc-btn';btn.textContent=c;
    btn.onclick=()=>{if(btn.disabled)return;grid.querySelectorAll('.mc-btn').forEach(b=>b.disabled=true);
      if(c===q.ans){btn.classList.add('correct');sfxCorrect();setTimeout(()=>{if(game)game.questAnswered(true)},600)}
      else{btn.classList.add('wrong');sfxWrong();if(game)game.mistakes++;att++;
        if(att>=3){grid.querySelectorAll('.mc-btn').forEach(b=>{if(parseInt(b.textContent)===q.ans)b.classList.add('correct')});
          const h=document.createElement('p');h.style.cssText='text-align:center;color:#e65100;font-weight:700;margin-top:8px';
          h.textContent=t('hint')+q.ans;body.appendChild(h);
          setTimeout(()=>{if(game)game.questAnswered(true)},1500);return}
        setTimeout(()=>{grid.querySelectorAll('.mc-btn').forEach(b=>{b.disabled=false;b.classList.remove('wrong','correct')})},800)}};
    grid.appendChild(btn)});body.appendChild(grid);
}

function renderInput(body,q){
  const r=document.createElement('div');r.className='num-input-row';
  const eq=document.createElement('span');eq.className='num-eq';eq.textContent=q.eq;r.appendChild(eq);body.appendChild(r);
  const r2=document.createElement('div');r2.className='num-input-row';r2.style.marginTop='8px';
  const inp=document.createElement('input');inp.type='number';inp.className='num-input';inp.inputMode='numeric';r2.appendChild(inp);
  const btn=document.createElement('button');btn.className='num-submit';btn.textContent=t('submit');
  let att=0;
  function check(){
    if(parseInt(inp.value)===q.ans){sfxCorrect();inp.disabled=true;btn.disabled=true;
      setTimeout(()=>{if(game)game.questAnswered(true)},600)}
    else{sfxWrong();if(game)game.mistakes++;att++;
      if(att>=3){const h=document.createElement('p');h.style.cssText='text-align:center;color:#e65100;font-weight:700;margin-top:8px';
        h.textContent=t('hint')+q.ans;body.appendChild(h);
        setTimeout(()=>{if(game)game.questAnswered(true)},1500);return}
      inp.style.borderColor='#f44336';inp.style.background='#ffebee';inp.style.animation='shake 0.3s';
      setTimeout(()=>{inp.style.borderColor='#4CAF50';inp.style.background='';inp.style.animation='';inp.value='';inp.focus()},500)}}
  btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
  r2.appendChild(btn);body.appendChild(r2);setTimeout(()=>inp.focus(),150);
}

function renderTF2(body,q){

          const h=document.createElement('p');h.style.cssText='text-align:center;color:#e65100;font-weight:700;margin-top:8px';
          h.textContent=t('hint')+(q.ans?t('true_btn'):t('false_btn'));body.appendChild(h);

        setTimeout(()=>{row.querySelectorAll('.tf-btn').forEach(b=>{b.disabled=false;b.style.boxShadow=''})},800)}};

}

let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('AdaMathQuestDB',1);
  r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'li'})};
  r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=e=>rej(e)})}
function saveRecord(li,time,stars,mistakes){if(!db)return;const tx=db.transaction('records','readwrite');const s=tx.objectStore('records');
  const r=s.get(li);r.onsuccess=()=>{const ex=r.result;if(!ex||time<ex.time||stars>ex.stars)s.put({li,time,stars,mistakes,date:Date.now()})}}
function getRecords(){if(!db)return Promise.resolve({});return new Promise(res=>{const tx=db.transaction('records','readonly');
  const r=tx.objectStore('records').getAll();r.onsuccess=()=>{const m={};r.result.forEach(r=>m[r.li]=r);res(m)};r.onerror=()=>res({})})}

let rafId;

function initThreeJS() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  clock = new THREE.Clock();

  // Lighting
  const ambient = new THREE.AmbientLight(0x8899bb, 0.7);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 100;
  sun.shadow.camera.left = -40;
  sun.shadow.camera.right = 40;
  sun.shadow.camera.top = 40;
  sun.shadow.camera.bottom = -40;
  scene.add(sun);

  // Add hemisphere light for more natural look
  const hemi = new THREE.HemisphereLight(0x87CEEB, 0x7cb342, 0.3);
  scene.add(hemi);

  scene.background = new THREE.Color(0x87CEEB);

  const container = document.getElementById('game-container');
  container.appendChild(renderer.domElement);
}

function actualStartLevel(idx){
  showScreen('game-screen');

  if (!renderer) initThreeJS();

  // Reset scene
  while(scene.children.length > 0) {
    const child = scene.children[0];
    scene.remove(child);
  }
  // Re-add lights
  const ambient = new THREE.AmbientLight(0x8899bb, 0.7);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 100;
  sun.shadow.camera.left = -40;
  sun.shadow.camera.right = 40;
  sun.shadow.camera.top = 40;
  sun.shadow.camera.bottom = -40;
  scene.add(sun);
  const hemi = new THREE.HemisphereLight(0x87CEEB, 0x7cb342, 0.3);
  scene.add(hemi);

  function resize(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.removeEventListener('resize', resize);
  window.addEventListener('resize', resize);
  resize();

  game = new Game(idx);
  sceneObjects = sceneObjects.filter(o => o); // clean nulls

  if(rafId) cancelAnimationFrame(rafId);
  let mmCounter = 0;
  function loop(){
    if(!game)return;
    game.update();
    renderer.render(scene, camera);
    // Minimap every 10 frames
    if (mmCounter++ % 10 === 0) game.renderMinimap();
    rafId=requestAnimationFrame(loop);
  }
  loop();
}

function startLevel(idx){
  showLevelIntro(idx,()=>actualStartLevel(idx));
}

// ===== INPUT =====
document.addEventListener('keydown',e=>{
  if(e.repeat)return;initAudio();
  const dm={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  if(dm[e.key]&&game){e.preventDefault();game.moveDir=dm[e.key];game.moveHeld=true;game.tryMove(dm[e.key])}
  if((e.key===' '||e.key==='Enter')&&game&&!game.activeQuest){
    const bb=document.getElementById('speech-bubble');
    if(bb.style.display==='block'){bb.style.display='none'}
    else{const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
      const d=dirs[game.p.dir]||[0,1];const fx=game.p.x+d[0],fy=game.p.y+d[1];
      if(fx>=0&&fy>=0&&fx<game.mw&&fy<game.mh){
        const tile=game.map[fy][fx];
        if(tile===T.GATE){const g=game.gates.find(g=>g.x===fx&&g.y===fy);if(g&&!g.open)game.openGateQuest(g)}
        else if(tile===T.DOG_GATE){const nd=game.dogs.find(d=>!d.rescued&&d.cageGate&&d.cageGate.x===fx&&d.cageGate.y===fy);if(nd&&!nd.cageOpen){if(!nd.quests)nd.quests=genQuests(3,game.ld.diff);game.activeQuest={type:'dogCage',dog:nd,x:fx,y:fy};game.questList=nd.quests;game.questIdx=0;game.addBurst(fx+0.5,0.5,fy+0.5,8,'#FF9800');showQuestUI(game.questList,0,nd.quests.length)}}
        else if(INTERACT.has(tile))game.interactWith(fx,fy,tile)
      }
    }
  }
  if(e.key==='Escape'){if(game&&game.activeQuest){hideQuestUI();game.activeQuest=null;game.questList=null;game.questIdx=0}
    else if(game){game=null;if(rafId)cancelAnimationFrame(rafId);showLevelSelect()}}
});
document.addEventListener('keyup',e=>{
  const dm={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  if(dm[e.key]&&game&&game.moveDir===dm[e.key])game.moveHeld=false;
});

document.querySelectorAll('.dpad-btn[data-dir]').forEach(btn=>{const dir=btn.dataset.dir;
  function start(e){e.preventDefault();initAudio();if(game){game.moveDir=dir;game.moveHeld=true;game.tryMove(dir)}}
  function stop(e){e.preventDefault();if(game&&game.moveDir===dir)game.moveHeld=false}
  btn.addEventListener('touchstart',start,{passive:false});btn.addEventListener('mousedown',start);
  btn.addEventListener('touchend',stop,{passive:false});btn.addEventListener('mouseup',stop);btn.addEventListener('mouseleave',stop)});

document.querySelector('.dpad-center').addEventListener('touchstart',e=>{e.preventDefault();initAudio();if(!game)return;
  const bb=document.getElementById('speech-bubble');if(bb.style.display==='block'){bb.style.display='none';return}
  const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};const d=dirs[game.p.dir]||[0,1];
  const fx=game.p.x+d[0],fy=game.p.y+d[1];
  if(fx>=0&&fy>=0&&fx<game.mw&&fy<game.mh){const tile=game.map[fy][fx];
    if(tile===T.GATE){const g=game.gates.find(g=>g.x===fx&&g.y===fy);if(g&&!g.open)game.openGateQuest(g)}
    else if(tile===T.DOG_GATE){const nd=game.dogs.find(d=>!d.rescued&&d.cageGate&&d.cageGate.x===fx&&d.cageGate.y===fy);if(nd&&!nd.cageOpen){if(!nd.quests)nd.quests=genQuests(3,game.ld.diff);game.activeQuest={type:'dogCage',dog:nd,x:fx,y:fy};game.questList=nd.quests;game.questIdx=0;game.addBurst(fx+0.5,0.5,fy+0.5,8,'#FF9800');showQuestUI(game.questList,0,nd.quests.length)}}
    else if(INTERACT.has(tile))game.interactWith(fx,fy,tile)}
},{passive:false});

// Touch swipe on game container
document.addEventListener('DOMContentLoaded', () => {
  const gc = document.getElementById('game-container');
  if (!gc) return;
  let touchS=null;
  gc.addEventListener('touchstart',e=>{if(e.touches.length===1)touchS={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
  gc.addEventListener('touchend',e=>{if(!touchS||!game)return;
    const dx=e.changedTouches[0].clientX-touchS.x,dy=e.changedTouches[0].clientY-touchS.y;
    if(Math.sqrt(dx*dx+dy*dy)>30){const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');game.tryMove(dir)}
    touchS=null});
});

document.getElementById('hud-menu').addEventListener('click',()=>{if(game){game=null;if(rafId)cancelAnimationFrame(rafId);showLevelSelect()}});

// ===== INIT =====
async function init(){
  await openDB().catch(()=>{});
  const sl=localStorage.getItem('amq-lang');if(sl)LANG=sl;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
  document.querySelectorAll('.lang-btn').forEach(btn=>{btn.onclick=()=>{LANG=btn.dataset.lang;
    localStorage.setItem('amq-lang',LANG);
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
    updateI18N();initTitle()}});
  const sn=localStorage.getItem('amq-name');if(sn)document.getElementById('player-name').value=sn;
  document.getElementById('play-btn').addEventListener('click',()=>{initAudio();
    playerName=document.getElementById('player-name').value||'Ada';localStorage.setItem('amq-name',playerName);
    showGameIntro(()=>showLevelSelect())});
  document.getElementById('level-back').addEventListener('click',()=>{showScreen('title-screen');initTitle()});
  document.getElementById('reset-story').addEventListener('click',()=>{
    localStorage.removeItem('amq-intro-seen');storyState.introSeen=false;
    showFlash('Story reset! Click Play to see the intro again.','#FF9800')});
  updateI18N();initTitle();
}

function updateI18N(){document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.title="Ada's Math Quest 3D"}

init();
</script>
