        rot.setFromEuler(new THREE.Euler(rng*0.5, rng*3, rng*0.3));
        s4.set(0.7+rng*0.4, 0.5+rng*0.3, 0.7+rng*0.4);
        m4.compose(new THREE.Vector3(c+0.5, 0.1, r+0.5), rot, s4);
        rockIM.setMatrixAt(ri++, m4);
      }
    }
    rockIM.instanceMatrix.needsUpdate = true;
    scene.add(rockIM);
    sceneObjects.push(rockIM);
  }

  // Build buildings (BUILDING, BLDG_WINDOW, BLDG_DOOR)
  const bldTypes = [T.BUILDING, T.BLDG_WINDOW, T.BLDG_DOOR];
  const bldCount = bldTypes.reduce((s, t2) => s + (counts[t2] || 0), 0);
  if (bldCount > 0) {
    // Varying heights
    const bldGeo = new THREE.BoxGeometry(0.95, 1, 0.95);
    const bldIM = new THREE.InstancedMesh(bldGeo, MAT.building, bldCount);
    bldIM.castShadow = true;
    let bii = 0;
    const m4 = new THREE.Matrix4();
    // Window planes
    const windowPositions = [];
    // Door indicators
    const doorPositions = [];
    for (let r = 0; r < mh; r++) for (let c = 0; c < mw; c++) {
      const tile = map[r][c];
      if (bldTypes.includes(tile)) {
        const rng = ((r * 5 + c * 11) % 13) / 13;
        const h = 1.5 + rng * 1.5;
        m4.makeScale(1, h, 1);
        m4.setPosition(c + 0.5, h / 2, r + 0.5);
        bldIM.setMatrixAt(bii, m4);
        // Vary color per building
        const colorVar = new THREE.Color(0x8d4e3a).offsetHSL(0, 0, rng * 0.1 - 0.05);
        bldIM.setColorAt(bii, colorVar);
        bii++;
        if (tile === T.BLDG_WINDOW) windowPositions.push({x:c+0.5, y:h*0.6, z:r+0.5, h});
        if (tile === T.BLDG_DOOR) doorPositions.push({x:c+0.5, y:0.25, z:r+0.99});
      }
    }
    bldIM.instanceMatrix.needsUpdate = true;
    if (bldIM.instanceColor) bldIM.instanceColor.needsUpdate = true;
    scene.add(bldIM);
    sceneObjects.push(bldIM);

    // Add window planes
    if (windowPositions.length > 0) {
      const wGeo = new THREE.PlaneGeometry(0.15, 0.15);
      const wIM = new THREE.InstancedMesh(wGeo, MAT.window, windowPositions.length);
      windowPositions.forEach((wp, i) => {
        const m = new THREE.Matrix4();
        m.makeTranslation(wp.x, wp.y, wp.z + 0.48);
        wIM.setMatrixAt(i, m);
      });
      wIM.instanceMatrix.needsUpdate = true;
      scene.add(wIM);
      sceneObjects.push(wIM);
    }

    // Door panels
    if (doorPositions.length > 0) {
      const dGeo = new THREE.PlaneGeometry(0.2, 0.35);
      const dMat = new THREE.MeshStandardMaterial({color:0x3e2723, flatShading:true});
      const dIM = new THREE.InstancedMesh(dGeo, dMat, doorPositions.length);
      doorPositions.forEach((dp, i) => {
        const m = new THREE.Matrix4();
        m.makeTranslation(dp.x, dp.y, dp.z);
        dIM.setMatrixAt(i, m);
      });
      dIM.instanceMatrix.needsUpdate = true;
      scene.add(dIM);
      sceneObjects.push(dIM);
    }
  }

  // Build fences
  const fenceCount = (counts[T.FENCE] || 0);
  if (fenceCount > 0) {
    const fenceIM = new THREE.InstancedMesh(GEO.fence, MAT.fence, fenceCount);
    fenceIM.castShadow = true;
    fenceIM.userData.isFence = true;
    // Pointed caps on top of fence posts
    const capGeo = new THREE.ConeGeometry(0.055, 0.1, 4);
    const capIM = new THREE.InstancedMesh(capGeo, MAT.fenceCap, fenceCount);
    let fi = 0;
    const m4 = new THREE.Matrix4();
    const fenceRails = [];
    for (let r = 0; r < mh; r++) for (let c = 0; c < mw; c++) {
      if (map[r][c] === T.FENCE) {
        m4.makeTranslation(c + 0.5, 0.275, r + 0.5);
        fenceIM.setMatrixAt(fi, m4);
        // Cap on top
        m4.makeTranslation(c + 0.5, 0.6, r + 0.5);
        capIM.setMatrixAt(fi, m4);
        fi++;
        fenceRails.push({x: c + 0.5, z: r + 0.5});
      }
    }
    fenceIM.instanceMatrix.needsUpdate = true;
    capIM.instanceMatrix.needsUpdate = true;
    scene.add(fenceIM, capIM);
    sceneObjects.push(fenceIM, capIM);

    // Add horizontal rails between adjacent fence posts
    if (fenceRails.length > 0) {
      const railPairs = [];
      const fSet = new Set(fenceRails.map(f => f.x + ',' + f.z));
      for (const f of fenceRails) {
        // Check right neighbor
        if (fSet.has((f.x + 1) + ',' + f.z)) railPairs.push({x: f.x + 0.5, z: f.z, rot: 0});
        // Check bottom neighbor
        if (fSet.has(f.x + ',' + (f.z + 1))) railPairs.push({x: f.x, z: f.z + 0.5, rot: Math.PI/2});
      }
      if (railPairs.length > 0) {
        const railCount = railPairs.length * 2; // 2 rails per pair (top + bottom)
        const railIM = new THREE.InstancedMesh(GEO.fenceRail, MAT.fence, railCount);
        railIM.userData.isFence = true;
        let ri = 0;
        const rm = new THREE.Matrix4(), rq = new THREE.Quaternion(), rv = new THREE.Vector3();
        for (const rp of railPairs) {
          rq.setFromEuler(new THREE.Euler(0, rp.rot, 0));
          // Top rail
          rv.set(rp.x, 0.42, rp.z);
          rm.compose(rv, rq, new THREE.Vector3(1,1,1));
          railIM.setMatrixAt(ri++, rm);
          // Bottom rail
          rv.set(rp.x, 0.18, rp.z);
          rm.compose(rv, rq, new THREE.Vector3(1,1,1));
          railIM.setMatrixAt(ri++, rm);
        }
        railIM.instanceMatrix.needsUpdate = true;
        scene.add(railIM);
        sceneObjects.push(railIM);
      }
    }
  }

  // ===== BATCHED InstancedMesh for water, flowers, mushrooms, lampposts, taxis, bridges, road dashes, park bushes, houses, signs =====
  // Pre-count all tile types in one pass
  const waterPos = [], riverPos = [], flowerPos = [], mushPos = [], lampPos = [], taxiPos = [], bridgePos = [], dashPos = [], parkBushPos = [], housePos = [], signPos = [];
  for (let r = 0; r < mh; r++) for (let c = 0; c < mw; c++) {
    const tile = map[r][c];
    if (tile === T.WATER) waterPos.push({c, r});
    else if (tile === T.RIVER) riverPos.push({c, r});
    else if (tile === T.FLOWER) flowerPos.push({c, r});
    else if (tile === T.MUSH) mushPos.push({c, r});
    else if (tile === T.LAMPPOST) lampPos.push({c, r});
    else if (tile === T.TAXI) taxiPos.push({c, r});
    else if (tile === T.BRIDGE) bridgePos.push({c, r});
    else if (tile === T.HOUSE) housePos.push({c, r});
    else if (tile === T.SIGN) signPos.push({c, r});
    if (tile === T.ROAD && (c + r) % 3 === 0) dashPos.push({c, r});
    if (tile === T.PARK && ((r*3+c*7)%5 === 0)) parkBushPos.push({c, r});
  }

  // --- Water & River (InstancedMesh, simple Y oscillation for animation) ---
  const waterGeoIM = new THREE.PlaneGeometry(1, 1, 1, 1);
  const rotQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2, 0, 0));
  const sv1 = new THREE.Vector3(1,1,1);
  [{tiles: waterPos, mat: MAT.water}, {tiles: riverPos, mat: MAT.river}].forEach(({tiles, mat}) => {
    if (tiles.length === 0) return;
    const wIM = new THREE.InstancedMesh(waterGeoIM, mat, tiles.length);
    const m4 = new THREE.Matrix4();
    tiles.forEach((wt, i) => {
      m4.compose(new THREE.Vector3(wt.c + 0.5, 0.02, wt.r + 0.5), rotQ, sv1);
      wIM.setMatrixAt(i, m4);
    });
    wIM.instanceMatrix.needsUpdate = true;
    scene.add(wIM);
    sceneObjects.push(wIM);
    waterMeshes.push(wIM); // store for animation
  });

  // --- Flowers (5 color batches, InstancedMesh per color) ---
  if (flowerPos.length > 0) {
    const flColors = [0xff69b4, 0xffeb3b, 0xff5722, 0x9c27b0, 0xe91e63];
    const flMats = flColors.map(c => new THREE.MeshStandardMaterial({color:c, flatShading:true, emissive:c, emissiveIntensity:0.2}));
    // Collect per-color instances (3 flowers per tile)
    const colorBuckets = flColors.map(() => []);
    flowerPos.forEach(ft => {
      for (let i = 0; i < 3; i++) {
        const ci = (ft.c * 3 + ft.r * 7 + i) % flColors.length;
        colorBuckets[ci].push({x: ft.c + 0.2 + i * 0.3, z: ft.r + 0.3 + (i % 2) * 0.4});
      }
    });
    const flGeo = new THREE.SphereGeometry(0.12, 4, 3); // slightly bigger geo, no per-mesh scale needed
    colorBuckets.forEach((bucket, ci) => {
      if (bucket.length === 0) return;
      const fIM = new THREE.InstancedMesh(flGeo, flMats[ci], bucket.length);
      const m4 = new THREE.Matrix4();
      bucket.forEach((p, i) => {
        m4.makeTranslation(p.x, 0.1, p.z);
        fIM.setMatrixAt(i, m4);
      });
      fIM.instanceMatrix.needsUpdate = true;
      scene.add(fIM);
      sceneObjects.push(fIM);
    });
  }

  // --- Mushrooms (2 InstancedMesh: stems + caps) ---
  if (mushPos.length > 0) {
    const stemGeo = new THREE.CylinderGeometry(0.05, 0.06, 0.16, 5);
    const capGeo = new THREE.SphereGeometry(0.12, 6, 4, 0, Math.PI*2, 0, Math.PI/2);
    const stemIM = new THREE.InstancedMesh(stemGeo, MAT.mushroomWhite, mushPos.length);
    const capIM = new THREE.InstancedMesh(capGeo, MAT.mushroom, mushPos.length);
    const m4 = new THREE.Matrix4();
    mushPos.forEach((mp, i) => {
      m4.makeTranslation(mp.c + 0.5, 0.06, mp.r + 0.5);
      stemIM.setMatrixAt(i, m4);
      m4.makeTranslation(mp.c + 0.5, 0.13, mp.r + 0.5);
      capIM.setMatrixAt(i, m4);
    });
    stemIM.instanceMatrix.needsUpdate = true;
    capIM.instanceMatrix.needsUpdate = true;
    scene.add(stemIM, capIM);
    sceneObjects.push(stemIM, capIM);
  }

  // --- Lampposts (InstancedMesh posts + bulbs, NO PointLights) ---
  if (lampPos.length > 0) {
    const postIM = new THREE.InstancedMesh(GEO.lampPost, MAT.dark, lampPos.length);
    const bulbIM = new THREE.InstancedMesh(GEO.lampBulb, MAT.lampLight, lampPos.length);
    const m4 = new THREE.Matrix4();
    lampPos.forEach((lp, i) => {
      m4.makeTranslation(lp.c + 0.5, 0.4, lp.r + 0.5);
      postIM.setMatrixAt(i, m4);
      m4.makeTranslation(lp.c + 0.5, 0.85, lp.r + 0.5);
      bulbIM.setMatrixAt(i, m4);
    });
    postIM.instanceMatrix.needsUpdate = true;
    bulbIM.instanceMatrix.needsUpdate = true;
    scene.add(postIM, bulbIM);
    sceneObjects.push(postIM, bulbIM);
  }

  // --- Taxis (InstancedMesh, no castShadow) ---
  if (taxiPos.length > 0) {
    const taxiIM = new THREE.InstancedMesh(GEO.taxiBody, MAT.taxi, taxiPos.length);
    const m4 = new THREE.Matrix4();
    taxiPos.forEach((tp, i) => {
      m4.makeTranslation(tp.c + 0.5, 0.12, tp.r + 0.5);
      taxiIM.setMatrixAt(i, m4);
    });
    taxiIM.instanceMatrix.needsUpdate = true;
    scene.add(taxiIM);
    sceneObjects.push(taxiIM);
  }

  // --- Bridges (InstancedMesh) ---
  if (bridgePos.length > 0) {
    const bridgeGeo = new THREE.BoxGeometry(1, 0.06, 1);
    const bridgeIM = new THREE.InstancedMesh(bridgeGeo, MAT.bridge, bridgePos.length);
    const m4 = new THREE.Matrix4();
    bridgePos.forEach((bp, i) => {
      m4.makeTranslation(bp.c + 0.5, 0.05, bp.r + 0.5);
      bridgeIM.setMatrixAt(i, m4);
    });
    bridgeIM.instanceMatrix.needsUpdate = true;
    bridgeIM.receiveShadow = true;
    scene.add(bridgeIM);
    sceneObjects.push(bridgeIM);
  }

  // Start platform
  if (levelData.start) {
    const sp = new THREE.Mesh(GEO.exitPlatform, MAT.start);
    sp.position.set(levelData.start.x + 0.5, 0.04, levelData.start.y + 0.5);
    scene.add(sp);
    sceneObjects.push(sp);
  }

  // Exit platform
  if (levelData.exit) {
    const ep = new THREE.Mesh(GEO.exitPlatform, MAT.exit);
    ep.position.set(levelData.exit.x + 0.5, 0.04, levelData.exit.y + 0.5);
    exitMesh = ep;
    scene.add(ep);
    sceneObjects.push(ep);
  }

  // --- Road center dashes (InstancedMesh) ---
  if (dashPos.length > 0) {
    const dashGeo = new THREE.BoxGeometry(0.08, 0.01, 0.3);
    const dashIM = new THREE.InstancedMesh(dashGeo, MAT.white, dashPos.length);
    const m4 = new THREE.Matrix4();
    dashPos.forEach((dp, i) => {
      m4.makeTranslation(dp.c + 0.5, 0.01, dp.r + 0.5);
      dashIM.setMatrixAt(i, m4);
    });
    dashIM.instanceMatrix.needsUpdate = true;
    scene.add(dashIM);
    sceneObjects.push(dashIM);
  }

  // --- Park bush decorations (InstancedMesh) ---
  if (parkBushPos.length > 0) {
    const pbGeo = new THREE.SphereGeometry(0.08, 4, 3);
    const pbIM = new THREE.InstancedMesh(pbGeo, MAT.canopyLight, parkBushPos.length);
    const m4 = new THREE.Matrix4();
    parkBushPos.forEach((pb, i) => {
      const ox = ((pb.c * 7 + pb.r * 3) % 17) / 17 * 0.4; // deterministic pseudo-random
      const oz = ((pb.c * 11 + pb.r * 5) % 13) / 13 * 0.4;
      m4.makeTranslation(pb.c + 0.3 + ox, 0.06, pb.r + 0.3 + oz);
      pbIM.setMatrixAt(i, m4);
    });
    pbIM.instanceMatrix.needsUpdate = true;
    scene.add(pbIM);
    sceneObjects.push(pbIM);
  }

  // --- Houses (InstancedMesh body + roof) ---
  if (housePos.length > 0) {
    const hMat = new THREE.MeshStandardMaterial({color:0x8d6e63, flatShading:true});
    const rMat = new THREE.MeshStandardMaterial({color:0xc62828, flatShading:true});
    const hGeo = new THREE.BoxGeometry(0.9, 1, 0.9);
    const rGeo = new THREE.ConeGeometry(0.6, 0.4, 4);
    const hIM = new THREE.InstancedMesh(hGeo, hMat, housePos.length);
    const rIM = new THREE.InstancedMesh(rGeo, rMat, housePos.length);
    hIM.castShadow = true;
    const m4 = new THREE.Matrix4(), rq = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI/4, 0));
    housePos.forEach((hp, i) => {
      const rng = ((hp.r*5+hp.c*11)%13)/13;
      const h = 1.0 + rng * 0.5;
      m4.makeScale(1, h, 1); m4.setPosition(hp.c+0.5, h/2, hp.r+0.5);
      hIM.setMatrixAt(i, m4);
      m4.compose(new THREE.Vector3(hp.c+0.5, h+0.2, hp.r+0.5), rq, sv1);
      rIM.setMatrixAt(i, m4);
    });
    hIM.instanceMatrix.needsUpdate = true;
    rIM.instanceMatrix.needsUpdate = true;
    scene.add(hIM, rIM);
    sceneObjects.push(hIM, rIM);
  }

  // --- Signs (InstancedMesh posts + boards) ---
  if (signPos.length > 0) {
    const spGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.5, 4);
    const sbGeo = new THREE.BoxGeometry(0.3, 0.2, 0.04);
    const spIM = new THREE.InstancedMesh(spGeo, MAT.fence, signPos.length);
    const sbIM = new THREE.InstancedMesh(sbGeo, MAT.fence, signPos.length);
    const m4 = new THREE.Matrix4();
    signPos.forEach((sp, i) => {
      m4.makeTranslation(sp.c+0.5, 0.25, sp.r+0.5);
      spIM.setMatrixAt(i, m4);
      m4.makeTranslation(sp.c+0.5, 0.45, sp.r+0.5);
      sbIM.setMatrixAt(i, m4);
    });
    spIM.instanceMatrix.needsUpdate = true;
    sbIM.instanceMatrix.needsUpdate = true;
    scene.add(spIM, sbIM);
    sceneObjects.push(spIM, sbIM);
  }
}


// ===== 3D CHARACTER BUILDERS =====
function buildPlayer3D(charKey) {
  const ch = CHARS[charKey] || CHARS.ranger;
  const group = new THREE.Group();

  // Body (slightly tapered torso — wider at shoulders)
  const bodyMat = new THREE.MeshStandardMaterial({color: ch.color, flatShading: true});
  const bodyGeo = new THREE.CylinderGeometry(0.10, 0.13, 0.28, 6);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.32;
  body.castShadow = true;
  group.add(body);
  group.userData.body = body;

  // Chest area (rounder upper body)
  const chest = new THREE.Mesh(new THREE.SphereGeometry(0.13, 6, 5), bodyMat);
  chest.scale.set(1.0, 0.7, 0.85);
  chest.position.y = 0.42;
  group.add(chest);

  // Pants
  const pantsMat = new THREE.MeshStandardMaterial({color: ch.pantsColor, flatShading: true});
  const pants = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.11, 0.12, 6), pantsMat);
  pants.position.y = 0.18;
  group.add(pants);

  // Head (slightly larger for cartoon charm — 1.15x)
  const headGeo = new THREE.SphereGeometry(0.19, 7, 6);
  const head = new THREE.Mesh(headGeo, MAT.skin);
  head.position.y = 0.62;
  head.castShadow = true;
  group.add(head);
  group.userData.head = head;

  // Cheeks (subtle, warm colored)
  const cheekMat = new THREE.MeshStandardMaterial({color:0xffb4a8, flatShading:true});
  const cheekL = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 3), cheekMat);
  cheekL.position.set(-0.12, 0.58, 0.10);
  const cheekR = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 3), cheekMat);
  cheekR.position.set(0.12, 0.58, 0.10);
  group.add(cheekL, cheekR);

  // Hair (styled with volume — front swoosh + back coverage)
  const hairMat = new THREE.MeshStandardMaterial({color: ch.hairColor, flatShading: true});
  // Back hair cap
  const hairBack = new THREE.Mesh(new THREE.SphereGeometry(0.20, 6, 5, 0, Math.PI*2, 0, Math.PI*0.6), hairMat);
  hairBack.position.y = 0.68;
  group.add(hairBack);
  // Side hair tufts
  const tuftL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 4, 3), hairMat);
  tuftL.position.set(-0.15, 0.65, 0.04);
  tuftL.scale.set(0.8, 1.2, 0.9);
  const tuftR = new THREE.Mesh(new THREE.SphereGeometry(0.06, 4, 3), hairMat);
  tuftR.position.set(0.15, 0.65, 0.04);
  tuftR.scale.set(0.8, 1.2, 0.9);
  group.add(tuftL, tuftR);
  // Front fringe
  const fringe = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.04, 0.10), hairMat);
  fringe.position.set(0, 0.73, 0.12);
  fringe.rotation.x = 0.2;
  group.add(fringe);

  // Eyes (larger, more expressive)
  const eyeWhiteMat = new THREE.MeshStandardMaterial({color:0xffffff,flatShading:true});
  const ewL = new THREE.Mesh(new THREE.SphereGeometry(0.045, 5, 4), eyeWhiteMat);
  ewL.position.set(-0.065, 0.63, 0.14);
  const ewR = new THREE.Mesh(new THREE.SphereGeometry(0.045, 5, 4), eyeWhiteMat);
  ewR.position.set(0.065, 0.63, 0.14);
  group.add(ewL, ewR);
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.028, 4, 3), MAT.dark);
  eyeL.position.set(-0.06, 0.63, 0.17);
  const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.028, 4, 3), MAT.dark);
  eyeR.position.set(0.06, 0.63, 0.17);
  group.add(eyeL, eyeR);
  // Eye shine
  const shineMat = new THREE.MeshBasicMaterial({color:0xffffff});
  const shineL = new THREE.Mesh(new THREE.SphereGeometry(0.01, 3, 3), shineMat);
  shineL.position.set(-0.052, 0.645, 0.185);
  const shineR = new THREE.Mesh(new THREE.SphereGeometry(0.01, 3, 3), shineMat);
  shineR.position.set(0.068, 0.645, 0.185);
  group.add(shineL, shineR);

  // Nose (tiny)
  const noseMat = new THREE.MeshStandardMaterial({color:0xd4967a, flatShading:true});
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.018, 4, 3), noseMat);
  nose.position.set(0, 0.59, 0.17);
  group.add(nose);

  // Mouth (happy smile line)
  const mouthMat = new THREE.MeshStandardMaterial({color:0xc0392b, flatShading:true});
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.006, 3, 6, Math.PI), mouthMat);
  mouth.position.set(0, 0.56, 0.16);
  mouth.rotation.x = 0.1;
  group.add(mouth);

  // Arms (with hands)
  const armMat = new THREE.MeshStandardMaterial({color: ch.color, flatShading: true});
  const armGeoUpper = new THREE.CylinderGeometry(0.035, 0.03, 0.12, 4);
  const armLU = new THREE.Mesh(armGeoUpper, armMat);
  armLU.position.set(-0.19, 0.38, 0);
  const armRU = new THREE.Mesh(armGeoUpper, armMat);
  armRU.position.set(0.19, 0.38, 0);
  group.add(armLU, armRU);
  group.userData.armL = armLU;
  group.userData.armR = armRU;
  // Hands (small spheres)
  const handL = new THREE.Mesh(new THREE.SphereGeometry(0.03, 4, 3), MAT.skin);
  handL.position.set(-0.19, 0.30, 0);
  const handR = new THREE.Mesh(new THREE.SphereGeometry(0.03, 4, 3), MAT.skin);
  handR.position.set(0.19, 0.30, 0);
  group.add(handL, handR);

  // Legs (with shin taper)
  const legGeo = new THREE.CylinderGeometry(0.04, 0.035, 0.15, 5);
  const legL = new THREE.Mesh(legGeo, pantsMat);
  legL.position.set(-0.065, 0.08, 0);
  const legR = new THREE.Mesh(legGeo, pantsMat);
  legR.position.set(0.065, 0.08, 0);
  group.add(legL, legR);
  group.userData.legL = legL;
  group.userData.legR = legR;

  // Shoes (chunky, rounded)
  const shoeGeo = new THREE.BoxGeometry(0.065, 0.045, 0.09);
  const shoeL = new THREE.Mesh(shoeGeo, MAT.shoe);
  shoeL.position.set(-0.065, 0.02, 0.012);
  const shoeR = new THREE.Mesh(shoeGeo, MAT.shoe);
  shoeR.position.set(0.065, 0.02, 0.012);
  group.add(shoeL, shoeR);
  group.userData.shoeL = shoeL;
  group.userData.shoeR = shoeR;

  // Accessory
  if (ch.accessory === 'backpack') {
    const bpMat = new THREE.MeshStandardMaterial({color:0x795548, flatShading:true});
    const bp = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.17, 0.09), bpMat);
    bp.position.set(0, 0.35, -0.14);
    group.add(bp);
    // Backpack straps
    const strapMat = new THREE.MeshStandardMaterial({color:0x5d4037, flatShading:true});
    const strapL = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.14, 0.03), strapMat);
    strapL.position.set(-0.04, 0.38, -0.10);
    const strapR = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.14, 0.03), strapMat);
    strapR.position.set(0.04, 0.38, -0.10);
    group.add(strapL, strapR);
  } else if (ch.accessory === 'cap') {
    const capMat = new THREE.MeshStandardMaterial({color:0xf44336, flatShading:true});
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.14, 0.06, 6), capMat);
    cap.position.y = 0.75;
    group.add(cap);
    // Visor
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.02, 0.10), capMat);
    visor.position.set(0, 0.73, 0.14);
    visor.rotation.x = -0.15;
    group.add(visor);
  } else if (ch.accessory === 'glasses') {
    const gMat = new THREE.MeshStandardMaterial({color:0x333333, flatShading:true});
    const gL = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.008, 4, 6), gMat);
    gL.position.set(-0.06, 0.63, 0.16);
    const gR = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.008, 4, 6), gMat);
    gR.position.set(0.06, 0.63, 0.16);
    const bridge = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.07, 3), gMat);
    bridge.rotation.z = Math.PI/2;
    bridge.position.set(0, 0.63, 0.17);
    group.add(gL, gR, bridge);
  }

  group.scale.set(1.0, 1.0, 1.0);
  return group;
}

function buildDog3D(dogKey) {
  const dog = DOGS[dogKey]; if (!dog) return new THREE.Group();
  const group = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({color: dog.bodyColor, flatShading: true});
  const bellyMat = new THREE.MeshStandardMaterial({color: dog.bellyColor, flatShading: true});
  const earMat = new THREE.MeshStandardMaterial({color: dog.earColor, flatShading: true});

  // Size multiplier based on dog breed
  const sizeScale = dog.size === 'big' ? 1.15 : dog.size === 'small' ? 0.88 : 1.0;

  // Breed-specific proportions
  const isCorgi = dogKey === 'corgi';
  const isGolden = dogKey === 'golden';
  const isHusky = dogKey === 'husky';
  const isPoodle = dogKey === 'poodle';
  const isDalmatian = dogKey === 'dalmatian';
  const isBeagle = dogKey === 'beagle';

  const bodyLen = isCorgi ? 0.38 : isGolden ? 0.36 : isPoodle ? 0.30 : 0.34;
  const bodyRad = isCorgi ? 0.16 : isPoodle ? 0.13 : isHusky ? 0.18 : 0.16;
  const legH = isCorgi ? 0.10 : isPoodle ? 0.22 : isGolden ? 0.18 : isHusky ? 0.18 : 0.16;
  const headSize = isCorgi ? 0.17 : isGolden ? 0.18 : isHusky ? 0.17 : isPoodle ? 0.15 : 0.16;

  // ---- BODY (tapered barrel shape using LatheGeometry) ----
  const bodyProfile = [];
  const bodySegs = 10;
  for (let i = 0; i <= bodySegs; i++) {
    const t = i / bodySegs;
    // Barrel shape: wider at front (chest), tapering at rear
    const chestBulge = Math.sin(t * Math.PI) * 0.25;
    const frontBias = (1 - t) * 0.05; // Slightly wider at front
    const r = bodyRad * (0.7 + chestBulge + frontBias);
    bodyProfile.push(new THREE.Vector2(r, (t - 0.5) * bodyLen));
  }
  const bodyGeo = new THREE.LatheGeometry(bodyProfile, 8);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.rotation.x = Math.PI / 2; // Align horizontally
  body.position.set(0, legH + bodyRad * 0.7, 0);
  body.castShadow = true;
  group.add(body);

  // Belly patch (lighter underside)
  const bellyGeo = new THREE.SphereGeometry(bodyRad * 0.85, 6, 4);
  const belly = new THREE.Mesh(bellyGeo, bellyMat);
  belly.scale.set(1.0, 0.45, isCorgi ? 1.4 : 1.15);
  belly.position.set(0, legH + bodyRad * 0.25, 0);
  group.add(belly);

  // ---- CHEST TUFT (golden, husky — fluffier front) ----
  if (isGolden || isHusky) {
    const chestMat = isGolden ? bellyMat : bodyMat;
    const chest = new THREE.Mesh(new THREE.SphereGeometry(bodyRad * 0.7, 5, 4), chestMat);
    chest.position.set(0, legH + bodyRad * 0.5, bodyLen * 0.45);
    chest.scale.set(1.0, 0.9, 0.7);
    group.add(chest);
  }

  // ---- HEAD (breed-specific shape) ----
  const headY = legH + bodyRad * 1.1;
  const headZ = bodyLen * 0.48 + headSize * 0.4;

  // Main head shape — ellipsoid, different per breed
  const headGeo = new THREE.SphereGeometry(headSize, 8, 6);
  const head = new THREE.Mesh(headGeo, bodyMat);
  if (isCorgi) {
    head.scale.set(1.15, 0.9, 1.0); // Wide, slightly flat
  } else if (isHusky) {
    head.scale.set(1.0, 0.95, 1.1); // Wolf-like, slightly elongated
  } else if (isPoodle) {
    head.scale.set(1.0, 1.05, 1.0); // Rounder
  } else if (isGolden) {
    head.scale.set(1.1, 0.95, 1.0); // Wide, friendly
  }
  head.position.set(0, headY, headZ);
  group.add(head);
  group.userData.head = head;

  // Brow ridge (subtle, adds definition)
  const browMat = bodyMat;
  const browL = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 3), browMat);
  browL.scale.set(1.5, 0.6, 0.8);
  browL.position.set(-0.05, headY + headSize * 0.4, headZ + headSize * 0.55);
  const browR = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 3), browMat);
  browR.scale.set(1.5, 0.6, 0.8);
  browR.position.set(0.05, headY + headSize * 0.4, headZ + headSize * 0.55);
  group.add(browL, browR);

  // ---- SNOUT (tapered, breed-specific length) ----
  const snoutLen = isCorgi ? 0.10 : isGolden ? 0.14 : isHusky ? 0.13 : isPoodle ? 0.09 : isBeagle ? 0.12 : 0.11;
  const snoutRad = isCorgi ? 0.065 : isGolden ? 0.07 : 0.06;
  const snoutGeo = new THREE.CylinderGeometry(snoutRad * 0.6, snoutRad, snoutLen, 6);
  const snout = new THREE.Mesh(snoutGeo, bodyMat);
  snout.rotation.x = Math.PI / 2;
  snout.position.set(0, headY - headSize * 0.15, headZ + headSize * 0.7 + snoutLen * 0.3);
  group.add(snout);

  // Snout bridge (top of muzzle)
  const snoutBridge = new THREE.Mesh(new THREE.BoxGeometry(snoutRad * 1.2, 0.02, snoutLen * 0.8), bodyMat);
  snoutBridge.position.set(0, headY - headSize * 0.02, headZ + headSize * 0.65 + snoutLen * 0.2);
  group.add(snoutBridge);

  // Nose (shiny, on tip of snout)
  const noseSize = isGolden ? 0.04 : isCorgi ? 0.035 : 0.035;
  const nose = new THREE.Mesh(new THREE.SphereGeometry(noseSize, 5, 4), MAT.dogNose);
  nose.scale.set(1.2, 0.9, 0.9);
  nose.position.set(0, headY - headSize * 0.12, headZ + headSize * 0.7 + snoutLen * 0.75);
  group.add(nose);

  // ---- EYES (larger, more expressive with shine) ----
  const eyeSpread = headSize * 0.42;
  const eyeY = headY + headSize * 0.2;
  const eyeZ = headZ + headSize * 0.65;

  const eyeWhiteGeo = new THREE.SphereGeometry(0.045, 6, 4);
  const eyeWhiteL = new THREE.Mesh(eyeWhiteGeo, MAT.dogEyeWhite);
  eyeWhiteL.position.set(-eyeSpread, eyeY, eyeZ);
  const eyeWhiteR = new THREE.Mesh(eyeWhiteGeo, MAT.dogEyeWhite);
  eyeWhiteR.position.set(eyeSpread, eyeY, eyeZ);
  group.add(eyeWhiteL, eyeWhiteR);

  const pupilGeo = new THREE.SphereGeometry(0.03, 5, 4);
  const pupilL = new THREE.Mesh(pupilGeo, MAT.dark);
  pupilL.position.set(-eyeSpread * 0.92, eyeY, eyeZ + 0.025);
  const pupilR = new THREE.Mesh(pupilGeo, MAT.dark);
  pupilR.position.set(eyeSpread * 0.92, eyeY, eyeZ + 0.025);
  group.add(pupilL, pupilR);

  // Eye shine (makes eyes look alive)
  const shineMat = new THREE.MeshBasicMaterial({color:0xffffff});
  const shineGeo = new THREE.SphereGeometry(0.012, 3, 3);
  const shL = new THREE.Mesh(shineGeo, shineMat);
  shL.position.set(-eyeSpread * 0.82, eyeY + 0.015, eyeZ + 0.04);
  const shR = new THREE.Mesh(shineGeo, shineMat);
  shR.position.set(eyeSpread * 0.82 + 0.01, eyeY + 0.015, eyeZ + 0.04);
  group.add(shL, shR);

  // ---- HUSKY FACE MASK (white marking pattern) ----
  if (isHusky) {
    const maskMat = new THREE.MeshStandardMaterial({color: 0xECEFF1, flatShading: true});
    // Forehead blaze
    const blaze = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.03), maskMat);
    blaze.position.set(0, headY + headSize * 0.3, headZ + headSize * 0.7);
    group.add(blaze);
    // Under-eye white patches
    const patchL = new THREE.Mesh(new THREE.SphereGeometry(0.035, 4, 3), maskMat);
    patchL.scale.set(1.3, 0.7, 0.5);
    patchL.position.set(-eyeSpread * 0.7, eyeY - 0.02, eyeZ + 0.01);
    const patchR = new THREE.Mesh(new THREE.SphereGeometry(0.035, 4, 3), maskMat);
    patchR.scale.set(1.3, 0.7, 0.5);
    patchR.position.set(eyeSpread * 0.7, eyeY - 0.02, eyeZ + 0.01);
    group.add(patchL, patchR);
    // Muzzle white
    const muzzleWhite = new THREE.Mesh(new THREE.SphereGeometry(snoutRad * 0.9, 5, 4), maskMat);
    muzzleWhite.position.set(0, headY - headSize * 0.2, headZ + headSize * 0.7 + snoutLen * 0.4);
    muzzleWhite.scale.set(1.0, 0.8, 1.0);
    group.add(muzzleWhite);
  }

  // ---- BEAGLE TRI-COLOR MARKING ----
  if (isBeagle) {
    const darkMat = new THREE.MeshStandardMaterial({color: 0x3E2723, flatShading: true});
    // Dark saddle on back
    const saddle = new THREE.Mesh(new THREE.SphereGeometry(bodyRad * 0.8, 5, 4), darkMat);
    saddle.scale.set(1.1, 0.5, 1.2);
    saddle.position.set(0, legH + bodyRad * 1.3, -bodyLen * 0.1);
    group.add(saddle);
    // White muzzle
    const whiteMat = new THREE.MeshStandardMaterial({color: 0xFFF8E1, flatShading: true});
    const muzzleW = new THREE.Mesh(new THREE.SphereGeometry(snoutRad * 0.8, 4, 3), whiteMat);
    muzzleW.position.set(0, headY - headSize * 0.2, headZ + headSize * 0.65 + snoutLen * 0.3);
    group.add(muzzleW);
  }

  // ---- EARS (breed-specific) ----
  if (dog.earStyle === 'floppy') {
    // Big floppy ears — teardrop shaped, drooping down
    const earH = isGolden ? 0.16 : isBeagle ? 0.18 : 0.14;
    const earW = isBeagle ? 0.10 : 0.08;
    const earGeo = new THREE.SphereGeometry(earW, 5, 4);
    const eL = new THREE.Mesh(earGeo, earMat);
    eL.scale.set(0.6, earH / earW, 0.5);
    eL.position.set(-headSize * 0.75, headY + headSize * 0.05, headZ - headSize * 0.15);
    eL.rotation.z = 0.4;
    eL.rotation.x = 0.15;
    const eR = new THREE.Mesh(earGeo, earMat);
    eR.scale.set(0.6, earH / earW, 0.5);
    eR.position.set(headSize * 0.75, headY + headSize * 0.05, headZ - headSize * 0.15);
    eR.rotation.z = -0.4;
    eR.rotation.x = 0.15;
    group.add(eL, eR);
    // Ear tips (rounded end for floppy ears)
    const tipL = new THREE.Mesh(new THREE.SphereGeometry(earW * 0.5, 4, 3), earMat);
    tipL.position.set(-headSize * 0.85, headY - earH * 0.6, headZ - headSize * 0.15);
    const tipR = new THREE.Mesh(new THREE.SphereGeometry(earW * 0.5, 4, 3), earMat);
    tipR.position.set(headSize * 0.85, headY - earH * 0.6, headZ - headSize * 0.15);
    group.add(tipL, tipR);
  } else {
    // Pointy/perky ears — triangular, wider at base
    const earH2 = isCorgi ? 0.14 : isHusky ? 0.12 : 0.10;
    const earBaseW = isCorgi ? 0.07 : 0.06;
    const earGeo = new THREE.ConeGeometry(earBaseW, earH2, 4);
    const eL = new THREE.Mesh(earGeo, earMat);
    eL.position.set(-headSize * 0.55, headY + headSize * 0.6 + earH2 * 0.3, headZ - headSize * 0.1);
    eL.rotation.z = 0.2;
    const eR = new THREE.Mesh(earGeo, earMat);
    eR.position.set(headSize * 0.55, headY + headSize * 0.6 + earH2 * 0.3, headZ - headSize * 0.1);
    eR.rotation.z = -0.2;
    group.add(eL, eR);
    // Inner ear (lighter pink)
    const innerEarMat = new THREE.MeshStandardMaterial({color: 0xffb4a8, flatShading: true});
    const ieL = new THREE.Mesh(new THREE.ConeGeometry(earBaseW * 0.55, earH2 * 0.7, 4), innerEarMat);
    ieL.position.set(-headSize * 0.55, headY + headSize * 0.6 + earH2 * 0.3, headZ - headSize * 0.08);
    ieL.rotation.z = 0.2;
    const ieR = new THREE.Mesh(new THREE.ConeGeometry(earBaseW * 0.55, earH2 * 0.7, 4), innerEarMat);
    ieR.position.set(headSize * 0.55, headY + headSize * 0.6 + earH2 * 0.3, headZ - headSize * 0.08);
    ieR.rotation.z = -0.2;
    group.add(ieL, ieR);
  }

  // ---- MOUTH / TONGUE ----
  const tongue = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.012, 0.05), MAT.dogTongue);
  tongue.position.set(0.015, headY - headSize * 0.35, headZ + headSize * 0.6 + snoutLen * 0.4);
  tongue.rotation.x = 0.3;
  group.add(tongue);

  // ---- LEGS (tapered, with distinct paws) ----
  const frontLegZ = bodyLen * 0.32;
  const backLegZ = -bodyLen * 0.32;
  const legSpread = isCorgi ? 0.10 : isPoodle ? 0.08 : 0.10;
  const legPositions = [
    [-legSpread, 0, frontLegZ],  // front-left
    [legSpread, 0, frontLegZ],   // front-right
    [-legSpread, 0, backLegZ],   // back-left
    [legSpread, 0, backLegZ]     // back-right
  ];

  const legs = [];
  legPositions.forEach((p, i) => {
    const isFront = i < 2;
    // Upper leg (thigh/shoulder — wider at top)
    const upperH = legH * 0.55;
    const upperR1 = isPoodle ? 0.03 : 0.045;
    const upperR2 = isPoodle ? 0.025 : 0.035;
    const upperGeo = new THREE.CylinderGeometry(upperR2, upperR1, upperH, 5);
    const upper = new THREE.Mesh(upperGeo, bodyMat);
    upper.position.set(p[0], legH * 0.72 + upperH * 0.5, p[2]);
    group.add(upper);

    // Lower leg (shin — slightly thinner)
    const lowerH = legH * 0.55;
    const lowerR = isPoodle ? 0.022 : 0.032;
    const lowerGeo = new THREE.CylinderGeometry(lowerR, lowerR * 0.85, lowerH, 5);
    const lower = new THREE.Mesh(lowerGeo, bodyMat);
    lower.position.set(p[0], legH * 0.25 + lowerH * 0.3, p[2]);
    group.add(lower);

    legs.push(upper); // Animate the upper segment

    // Paw (wider, flatter — like a real paw)
    const pawW = isPoodle ? 0.03 : 0.045;
    const pawGeo = new THREE.BoxGeometry(pawW * 2, 0.025, pawW * 2.2);
    const paw = new THREE.Mesh(pawGeo, bodyMat);
    paw.position.set(p[0], 0.012, p[2] + 0.01);
    group.add(paw);
    // Paw toes (3 small bumps on front paws)
    if (isFront) {
      for (let t = -1; t <= 1; t++) {
        const toe = new THREE.Mesh(new THREE.SphereGeometry(0.012, 3, 3), bodyMat);
        toe.position.set(p[0] + t * 0.015, 0.01, p[2] + pawW * 1.2);
        group.add(toe);
      }
    }
  });
  group.userData.legs = legs;

  // ---- TAIL (curved using TubeGeometry + CatmullRomCurve3) ----
  const tailBaseY = legH + bodyRad * 0.9;
  const tailBaseZ = -bodyLen * 0.48;
  let tailCurve;
  if (isHusky) {
    // Husky: curled tail over the back
    tailCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0.08, -0.06),
      new THREE.Vector3(0, 0.14, -0.02),
      new THREE.Vector3(0, 0.12, 0.04)
    ]);
  } else if (isCorgi) {
    // Corgi: tiny nub tail
    tailCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0.03, -0.03),
      new THREE.Vector3(0, 0.04, -0.04)
    ]);
  } else if (isGolden) {
    // Golden: long, flowing, slightly curved
    tailCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0.06, -0.08),
      new THREE.Vector3(0, 0.10, -0.14),
      new THREE.Vector3(0, 0.08, -0.18)
    ]);
  } else if (isPoodle) {
    // Poodle: upright, curved
    tailCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0.08, -0.04),
      new THREE.Vector3(0, 0.15, -0.02),
      new THREE.Vector3(0, 0.18, -0.01)
    ]);
  } else {
    // Default: gentle upward curve
    tailCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0.06, -0.06),
      new THREE.Vector3(0, 0.10, -0.10),
      new THREE.Vector3(0, 0.08, -0.14)
    ]);
  }
  const tailRadius = isCorgi ? 0.018 : isGolden ? 0.025 : 0.02;
  const tailTubeGeo = new THREE.TubeGeometry(tailCurve, 8, tailRadius, 5, false);
  const tail = new THREE.Mesh(tailTubeGeo, bodyMat);
  tail.position.set(0, tailBaseY, tailBaseZ);
  group.add(tail);
  group.userData.tail = tail;

  // Golden tail feathering (fluffy end)
  if (isGolden) {
    const feather1 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 4, 3), bodyMat);
    feather1.position.set(0, tailBaseY + 0.08, tailBaseZ - 0.15);
    const feather2 = new THREE.Mesh(new THREE.SphereGeometry(0.025, 4, 3), bodyMat);
    feather2.position.set(0, tailBaseY + 0.06, tailBaseZ - 0.18);
    group.add(feather1, feather2);
  }

  // ---- POODLE PUFFS ----
  if (dog.curly) {
    const puffMat = new THREE.MeshStandardMaterial({color: dog.bodyColor, flatShading: true});
    // Larger head puff (pom-pom)
    const headPuff = new THREE.Mesh(new THREE.SphereGeometry(headSize * 0.7, 6, 5), puffMat);
    headPuff.position.set(0, headY + headSize * 0.45, headZ - headSize * 0.1);
    group.add(headPuff);
    // Chest puff
    const chestPuff = new THREE.Mesh(new THREE.SphereGeometry(0.09, 5, 4), puffMat);
    chestPuff.position.set(0, legH + bodyRad * 0.45, bodyLen * 0.3);
    group.add(chestPuff);
    // Ankle puffs
    legPositions.forEach(p => {
      const puff = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 3), puffMat);
      puff.position.set(p[0], 0.04, p[2]);
      group.add(puff);
    });
    // Tail puff (pom at end)
    const tailPuff = new THREE.Mesh(new THREE.SphereGeometry(0.04, 5, 4), puffMat);
    tailPuff.position.set(0, tailBaseY + 0.16, tailBaseZ - 0.01);
    group.add(tailPuff);
  }

  // ---- SPOTS (dalmatian) ----
  if (dog.spotColor) {
    const spotMat = new THREE.MeshStandardMaterial({color: dog.spotColor, flatShading: true});
    // Body spots
    const spots = [
      [0.13, legH + bodyRad * 0.85, 0.06, 0.042],
      [-0.09, legH + bodyRad * 0.9, -0.07, 0.038],
      [0.04, legH + bodyRad * 1.1, 0.14, 0.032],
      [-0.11, legH + bodyRad * 0.55, 0.09, 0.037],
      [0.07, legH + bodyRad * 0.6, -0.11, 0.033],
      [-0.04, legH + bodyRad * 1.0, 0.02, 0.028],
      [0.10, legH + bodyRad * 0.7, -0.04, 0.030],
      [-0.06, legH + bodyRad * 1.15, -0.13, 0.025]
    ];
    spots.forEach(sp => {
      const spot = new THREE.Mesh(new THREE.SphereGeometry(sp[3], 4, 3), spotMat);
      spot.scale.set(1.0, 0.5, 1.0); // Flatten against body
      spot.position.set(sp[0], sp[1], sp[2]);
      group.add(spot);
    });
    // Head spot
    const headSpot = new THREE.Mesh(new THREE.SphereGeometry(0.03, 4, 3), spotMat);
    headSpot.position.set(-0.06, headY + headSize * 0.3, headZ + headSize * 0.3);
    group.add(headSpot);
  }

  // ---- COLLAR (colored ring around neck) ----
  const collarColor = dogKey === 'golden' ? 0xe53935 : dogKey === 'husky' ? 0x1565c0 :
    dogKey === 'corgi' ? 0xff9800 : dogKey === 'poodle' ? 0xce93d8 :
    dogKey === 'dalmatian' ? 0xe53935 : 0x4caf50;
  const collarMat = new THREE.MeshStandardMaterial({color: collarColor, flatShading: true});
  const collarRad = headSize * 0.65;
  const collar = new THREE.Mesh(new THREE.TorusGeometry(collarRad, 0.022, 5, 8), collarMat);
  collar.position.set(0, headY - headSize * 0.45, headZ - headSize * 0.2);
  collar.rotation.x = Math.PI / 2;
  group.add(collar);

  // Collar tag (heart or disc shape)
  const tagMat = new THREE.MeshStandardMaterial({color: 0xffd700, flatShading: true, metalness: 0.6, roughness: 0.3});
  const tag = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.005, 5), tagMat);
  tag.position.set(0, headY - headSize * 0.6, headZ);
  group.add(tag);

  // ---- BASE DISC (for visibility) ----
  const discMat = new THREE.MeshStandardMaterial({color: 0xffcc80, emissive: 0xffcc80, emissiveIntensity: 0.3, flatShading: true});
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.04, 8), discMat);
  disc.position.y = 0.02;
  group.add(disc);

  // ---- FLOATING PAW MARKER ----
  const pawMarker = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 5, 4),
    new THREE.MeshStandardMaterial({color: 0xffeb3b, emissive: 0xffeb3b, emissiveIntensity: 0.5, flatShading: true})
  );
  pawMarker.position.y = 0.7;
  group.add(pawMarker);
  group.userData.marker = pawMarker;

  group.scale.set(sizeScale, sizeScale, sizeScale);
  return group;
}

function buildNPC3D(tileType) {
  const group = new THREE.Group();

      feather.rotation.x = 0.3;
      feather.rotation.y = i * 0.15;
      group.add(feather);
    }

    // Thin stick legs with feet
    const legMat = new THREE.MeshStandardMaterial({color: 0x795548, flatShading: true});
    const lL = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.006, 0.10, 3), legMat);
    lL.position.set(-0.035, 0.14, 0.01);
    const lR = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.006, 0.10, 3), legMat);
    lR.position.set(0.035, 0.14, 0.01);
    group.add(lL, lR);
    // Tiny feet (3 toes each)
    for (let side = -1; side <= 1; side += 2) {
      const x = side * 0.035;
      for (let t = -1; t <= 1; t++) {
        const toe = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.003, 0.025, 3), legMat);
        toe.rotation.x = Math.PI / 2;
        toe.position.set(x + t * 0.008, 0.09, 0.02 + Math.abs(t) * 0.005);
        group.add(toe);
      }
    }

    // Disc and marker
    const discColor = 0x81d4fa;
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.04, 8),
      new THREE.MeshStandardMaterial({color: discColor, emissive: discColor, emissiveIntensity: 0.3, flatShading: true}));
    disc.position.y = 0.05;
    group.add(disc);
    const marker = new THREE.Mesh(
      new THREE.ConeGeometry(0.08, 0.15, 4),
      new THREE.MeshStandardMaterial({color: 0x64b5f6, emissive: 0x64b5f6, emissiveIntensity: 0.4, flatShading: true})
    );
    marker.rotation.x = Math.PI;
    marker.position.y = 0.68;
    group.add(marker);
    group.userData.marker = marker;
    group.scale.set(0.95, 0.95, 0.95);

  } else {
    // Fallback — simple creature
    const bodyMat = new THREE.MeshStandardMaterial({color: 0x8bc34a, flatShading: true});
    const body = new THREE.Mesh(GEO.capsule, bodyMat);
    body.position.y = 0.3;
    group.add(body);
    const head = new THREE.Mesh(GEO.head, new THREE.MeshStandardMaterial({color: 0xffeb3b, flatShading: true}));
    head.position.y = 0.55;
    group.add(head);
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.04, 8),
      new THREE.MeshStandardMaterial({color: 0xffd54f, emissive: 0xffd54f, emissiveIntensity: 0.3, flatShading: true}));
    disc.position.y = 0.05;
    group.add(disc);
    const marker = new THREE.Mesh(
      new THREE.ConeGeometry(0.08, 0.15, 4),
      new THREE.MeshStandardMaterial({color: 0xff9800, emissive: 0xff9800, emissiveIntensity: 0.4, flatShading: true})
    );
    marker.rotation.x = Math.PI;
    marker.position.y = 0.85;
    group.add(marker);
    group.userData.marker = marker;
    group.scale.set(1.1, 1.1, 1.1);
  }

  return group;
}

function buildGate3D(isOpen = false) {
  const group = new THREE.Group();

  // ---- STONE PILLARS (stacked sections for texture) ----
  // Left pillar - main body
  const pL = new THREE.Mesh(GEO.gatePost, MAT.gateStone);
  pL.position.set(-0.40, 0.6, 0);
  pL.castShadow = true;
  // Right pillar - main body
  const pR = new THREE.Mesh(GEO.gatePost, MAT.gateStone);
  pR.position.set(0.40, 0.6, 0);
  pR.castShadow = true;
  group.add(pL, pR);
  group.userData.pL = pL;
  group.userData.pR = pR;

  // Pillar base stones (wider base)
  const baseGeo = new THREE.BoxGeometry(0.24, 0.15, 0.24);
  const baseL = new THREE.Mesh(baseGeo, MAT.gateStoneDark);
  baseL.position.set(-0.40, 0.075, 0);
  const baseR = new THREE.Mesh(baseGeo, MAT.gateStoneDark);
  baseR.position.set(0.40, 0.075, 0);
  group.add(baseL, baseR);

  // Capstones on top of pillars (small pyramids)
  const capGeo = new THREE.ConeGeometry(0.12, 0.18, 4);
  const capL = new THREE.Mesh(capGeo, MAT.gateIronGold);
  capL.position.set(-0.40, 1.28, 0);
  const capR = new THREE.Mesh(capGeo, MAT.gateIronGold);
  capR.position.set(0.40, 1.28, 0);
  group.add(capL, capR);

  // Decorative stone rings on pillars
  const ringGeo = new THREE.TorusGeometry(0.11, 0.025, 4, 6);
  const ringL = new THREE.Mesh(ringGeo, MAT.gateStoneDark);
  ringL.position.set(-0.40, 0.9, 0);
  ringL.rotation.x = Math.PI / 2;
  const ringR = new THREE.Mesh(ringGeo, MAT.gateStoneDark);
  ringR.position.set(0.40, 0.9, 0);
  ringR.rotation.x = Math.PI / 2;
  group.add(ringL, ringR);

  // ---- TOP ARCH (curved bar instead of flat) ----
  const bar = new THREE.Mesh(GEO.gateBar, MAT.gateIron);
  bar.position.set(0, 1.05, 0);
  group.add(bar);
  group.userData.bar = bar;

  // Arch decoration (half-torus on top)
  const archGeo = new THREE.TorusGeometry(0.3, 0.04, 5, 8, Math.PI);
  const arch = new THREE.Mesh(archGeo, MAT.gateIronGold);
  arch.position.set(0, 1.1, 0);
  arch.rotation.z = Math.PI;
  group.add(arch);

  // ---- IRON LATTICE / CROSS BARS ----
  const ironBarGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.75, 4);
  // Vertical bars
  for (let i = -2; i <= 2; i++) {
    const vbar = new THREE.Mesh(ironBarGeo, MAT.gateIron);
    vbar.position.set(i * 0.12, 0.55, 0);
    group.add(vbar);
  }
  // Horizontal cross bars
  const hbarGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.65, 4);
  const hbar1 = new THREE.Mesh(hbarGeo, MAT.gateIron);
  hbar1.rotation.z = Math.PI / 2;
  hbar1.position.set(0, 0.4, 0);
  const hbar2 = new THREE.Mesh(hbarGeo, MAT.gateIron);
  hbar2.rotation.z = Math.PI / 2;
  hbar2.position.set(0, 0.7, 0);
  group.add(hbar1, hbar2);

  // ---- ORNAMENTAL GOLD SPHERE at arch top ----
  const ornament = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 6, 4),
    MAT.gateIronGold
  );
  ornament.position.set(0, 1.4, 0);
  group.add(ornament);

  // ---- WARM GLOW (emissive orbs only, no PointLight for performance) ----
  // Large center glow orb (replaces PointLight)
  const centerGlow = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 5, 4),
    new THREE.MeshBasicMaterial({color: 0xffdd66, transparent: true, opacity: 0.7})
  );
  centerGlow.position.set(0, 1.15, 0);
  group.add(centerGlow);
  group.userData.light = centerGlow; // keep userData reference

  // Small glow orbs on pillar caps
  const glowMat = new THREE.MeshBasicMaterial({color: 0xffdd66, transparent: true, opacity: 0.6});
  const glowL = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 3), glowMat);
  glowL.position.set(-0.40, 1.4, 0);
  const glowR = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 3), glowMat);
  glowR.position.set(0.40, 1.4, 0);
  group.add(glowL, glowR);

  if (isOpen) {
    bar.rotation.x = -Math.PI / 2;
    bar.position.y = 1.3;
  }
  return group;
}
