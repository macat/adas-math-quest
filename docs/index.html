}

async function showLevelSelect(){
  showScreen('level-screen');const grid=document.getElementById('level-grid');
  const recs=await getRecords();
  grid.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const card=document.createElement('div');card.className='level-card';
    const rec=recs[i];const unlocked=i===0||recs[i-1];
    if(!unlocked)card.classList.add('locked');if(rec)card.classList.add('completed');
    const c=document.createElement('canvas');c.width=Math.min(lv.mw||lv.map[0].length,60)*2;c.height=Math.min(lv.mh||lv.map.length,40)*2;
    const cx=c.getContext('2d');cx.imageSmoothingEnabled=false;
    lv.map.forEach((row,r)=>row.forEach((tile,col)=>{
      cx.fillStyle=tile===T.TREE||tile===T.BUSH?'#2e7d32':tile===T.WATER?'#1976d2':
        tile===T.PATH||tile===T.BRIDGE?'#d4a574':tile===T.ROCK?'#78909c':tile===T.GATE?'#8d6e63':tile===T.DOG_GATE?'#8d6e63':tile===T.FENCE?'#a1887f':
        tile===T.DOG?'#FFD700':tile===T.EXIT?'#4CAF50':'#7cb342';
      cx.fillRect(col*2,r*2,2,2)}));card.appendChild(c);
    const h3=document.createElement('h3');h3.textContent=t(lv.nameKey);card.appendChild(h3);
    const p=document.createElement('p');p.textContent=lv.dogs.length+' 🐕 · '+(lv.gates.length)+' gates';card.appendChild(p);
    if(rec){const st=document.createElement('div');st.className='level-stars';
      st.textContent='⭐'.repeat(rec.stars)+'☆'.repeat(3-rec.stars);card.appendChild(st);
      const tm=document.createElement('p');const m=Math.floor(rec.time/60),s=(rec.time%60).toString().padStart(2,'0');
      tm.textContent=t('best_time')+': '+m+':'+s;tm.style.fontSize='0.7rem';card.appendChild(tm)}
    if(unlocked)card.onclick=()=>{initAudio();startLevel(i)};
    grid.appendChild(card)});
}

function showVictory(dogs,time,mistakes,stars,li){
  showScreen('victory-screen');hideQuestUI();
  const de=document.getElementById('victory-dogs');de.innerHTML='';
  dogs.forEach(dog=>{const div=document.createElement('div');div.className='victory-dog';
    div.style.animation='float 2s ease-in-out infinite';div.style.animationDelay=Math.random()*2+'s';
    const c=document.createElement('canvas');c.width=24;c.height=24;
    const cx=c.getContext('2d');cx.imageSmoothingEnabled=false;
    const dd=DOGS[dog.key];if(dd)SPR.draw(cx,dd.sprite,12,12,0,0,2);div.appendChild(c);
    const p=document.createElement('p');p.textContent=t('thank_you',playerName);div.appendChild(p);
    const nm=document.createElement('p');nm.textContent=dog.name;nm.style.fontWeight='800';nm.style.color='#333';div.appendChild(nm);
    de.appendChild(div)});
  const se=document.getElementById('victory-stats');
  const m=Math.floor(time/60),s=(time%60).toString().padStart(2,'0');
  se.innerHTML='<p style="font-size:1.2rem;text-align:center">'+'⭐'.repeat(stars)+'☆'.repeat(3-stars)+'</p>'+
    '<p>⏱️ '+t('time')+': '+m+':'+s+'</p><p>❌ '+t('mistakes')+': '+mistakes+'</p>'+
    '<p>🐕 '+t('dogs_saved')+': '+dogs.length+'</p>';
  sfxRescue();
  const nb=document.getElementById('victory-next');
  if(li<LEVELS.length-1){nb.style.display='block';nb.onclick=()=>startLevel(li+1)}else nb.style.display='none';
  document.getElementById('victory-menu').onclick=()=>showLevelSelect();
}

// ===== GAME LOOP =====
let canvas,ctx,rafId;
function actualStartLevel(idx){
  showScreen('game-screen');canvas=document.getElementById('game-canvas');ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
  function resize(){
      canvas.width=window.innerWidth;canvas.height=window.innerHeight;
      // Show ~25 tiles across on any screen size
      RENDER_SCALE=Math.max(1.5,Math.min(4,window.innerWidth/(25*TS)));
      if(game)game.updateCam(true);
    }
  window.removeEventListener('resize',resize);window.addEventListener('resize',resize);resize();
  game=new Game(idx);for(const k in tileCache)delete tileCache[k];
  if(rafId)cancelAnimationFrame(rafId);
  function loop(){if(!game)return;game.update();game.render(ctx);rafId=requestAnimationFrame(loop)}loop();
}
function startLevel(idx){
  showLevelIntro(idx,()=>actualStartLevel(idx));
}

// ===== INPUT =====
document.addEventListener('keydown',e=>{
  if(e.repeat)return;initAudio();
  const dm={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  if(dm[e.key]&&game){e.preventDefault();game.moveDir=dm[e.key];game.moveHeld=true;game.tryMove(dm[e.key])}
  if((e.key===' '||e.key==='Enter')&&game&&!game.activeQuest){
    const bb=document.getElementById('speech-bubble');
    if(bb.style.display==='block'){bb.style.display='none'}
    else{const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
      const d=dirs[game.p.dir]||[0,1];const fx=game.p.x+d[0],fy=game.p.y+d[1];
      if(fx>=0&&fy>=0&&fx<game.mw&&fy<game.mh){
        const tile=game.map[fy][fx];
        if(tile===T.GATE){const g=game.gates.find(g=>g.x===fx&&g.y===fy);if(g&&!g.open)game.openGateQuest(g)}
        else if(tile===T.DOG_GATE){const nd=game.dogs.find(d=>!d.rescued&&d.cageGate&&d.cageGate.x===fx&&d.cageGate.y===fy);if(nd&&!nd.cageOpen){if(!nd.quests)nd.quests=genQuests(3,game.ld.diff);game.activeQuest={type:'dogCage',dog:nd,x:fx,y:fy};game.questList=nd.quests;game.questIdx=0;game.addBurst(fx*TS+TS/2,fy*TS+TS/2,8,'#FF9800');showQuestUI(game.questList,0,nd.quests.length)}}
        else if(INTERACT.has(tile))game.interactWith(fx,fy,tile)
      }
    }
  }
  if(e.key==='Escape'){if(game&&game.activeQuest){hideQuestUI();game.activeQuest=null;game.questList=null;game.questIdx=0}
    else if(game){game=null;if(rafId)cancelAnimationFrame(rafId);showLevelSelect()}}
});
document.addEventListener('keyup',e=>{
  const dm={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  if(dm[e.key]&&game&&game.moveDir===dm[e.key])game.moveHeld=false;
});

document.querySelectorAll('.dpad-btn[data-dir]').forEach(btn=>{const dir=btn.dataset.dir;
  function start(e){e.preventDefault();initAudio();if(game){game.moveDir=dir;game.moveHeld=true;game.tryMove(dir)}}
  function stop(e){e.preventDefault();if(game&&game.moveDir===dir)game.moveHeld=false}
  btn.addEventListener('touchstart',start,{passive:false});btn.addEventListener('mousedown',start);
  btn.addEventListener('touchend',stop,{passive:false});btn.addEventListener('mouseup',stop);btn.addEventListener('mouseleave',stop)});

document.querySelector('.dpad-center').addEventListener('touchstart',e=>{e.preventDefault();initAudio();if(!game)return;
  const bb=document.getElementById('speech-bubble');if(bb.style.display==='block'){bb.style.display='none';return}
  const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};const d=dirs[game.p.dir]||[0,1];
  const fx=game.p.x+d[0],fy=game.p.y+d[1];
  if(fx>=0&&fy>=0&&fx<game.mw&&fy<game.mh){const tile=game.map[fy][fx];
    if(tile===T.GATE){const g=game.gates.find(g=>g.x===fx&&g.y===fy);if(g&&!g.open)game.openGateQuest(g)}
    else if(tile===T.DOG_GATE){const nd=game.dogs.find(d=>!d.rescued&&d.cageGate&&d.cageGate.x===fx&&d.cageGate.y===fy);if(nd&&!nd.cageOpen){if(!nd.quests)nd.quests=genQuests(3,game.ld.diff);game.activeQuest={type:'dogCage',dog:nd,x:fx,y:fy};game.questList=nd.quests;game.questIdx=0;game.addBurst(fx*TS+TS/2,fy*TS+TS/2,8,'#FF9800');showQuestUI(game.questList,0,nd.quests.length)}}
    else if(INTERACT.has(tile))game.interactWith(fx,fy,tile)}
},{passive:false});

let touchS=null;
document.getElementById('game-canvas').addEventListener('touchstart',e=>{if(e.touches.length===1)touchS={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
document.getElementById('game-canvas').addEventListener('touchend',e=>{if(!touchS||!game)return;
  const dx=e.changedTouches[0].clientX-touchS.x,dy=e.changedTouches[0].clientY-touchS.y;
  if(Math.sqrt(dx*dx+dy*dy)>30){const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');game.tryMove(dir)}
  touchS=null});

document.getElementById('hud-menu').addEventListener('click',()=>{if(game){game=null;if(rafId)cancelAnimationFrame(rafId);showLevelSelect()}});

// ===== INIT =====
async function init(){
  await openDB().catch(()=>{});
  const sl=localStorage.getItem('amq-lang');if(sl)LANG=sl;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
  document.querySelectorAll('.lang-btn').forEach(btn=>{btn.onclick=()=>{LANG=btn.dataset.lang;
    localStorage.setItem('amq-lang',LANG);
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
    updateI18N();initTitle()}});
  const sn=localStorage.getItem('amq-name');if(sn)document.getElementById('player-name').value=sn;
  document.getElementById('play-btn').addEventListener('click',()=>{initAudio();
    playerName=document.getElementById('player-name').value||'Ada';localStorage.setItem('amq-name',playerName);
    showGameIntro(()=>showLevelSelect())});
  document.getElementById('level-back').addEventListener('click',()=>{showScreen('title-screen');initTitle()});
  document.getElementById('reset-story').addEventListener('click',()=>{
    localStorage.removeItem('amq-intro-seen');storyState.introSeen=false;
    showFlash('Story reset! Click Play to see the intro again.','#FF9800')});
  updateI18N();initTitle();
}

function updateI18N(){document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.title="Ada's Math Quest"}

init();
</script>
